apis:
- name: Pliant Pro API (Customer)
  description: >-
    Pliant's Pro API enables customers to access Pliant credit card data and
    features programmatically — issue and manage cards, apply card controls and
    limits, retrieve transactions and accounting data, manage receipts, projects,
    teams, payments and statements, and subscribe to real-time event callbacks.
    OAuth 2.0 client-credentials (Auth0) bearer-token auth; offset pagination;
    header-based versioning via Pliant-API-Version.
