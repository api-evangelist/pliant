tags:
- name: Card Controls
  description: This tag is for operations related to card controls
paths:
  /cards/{cardId}/card-controls:
    put:
      summary: Change Card Controls
      description: Updates card controls for a single card. If the card control does not exist, it will be created. If the card control exists, it will be updated with the given values. Thus when updating, you have to provide all the values for the card control you want to set. Missing or not provided values are deleted if they exist.
      tags:
      - Card Controls
      operationId: update-card-controls-by-card
      parameters:
      - name: cardId
        in: path
        required: true
        description: The unique identifier of the card.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  categories:
                    type:
                    - object
                    - 'null'
                    required:
                    - type
                    - values
                    - restriction
                    properties:
                      type:
                        type: string
                        enum:
                        - MCC
                        - CATEGORY
                        description: Type of the category control to use. `MCC` represents the merchant category code as defined by card networks, whereas `CATEGORY` is a Pliant internal grouping of transactions done with a credit card. Both values can be found in the response from the [transaction details endpoint](./get-transactions-detail-batch) or in our [guide section](/docs/card-controls-1).
                      values:
                        type: array
                        items:
                          type: string
                        description: Values for this category control which should be allowed or blocked. Can be either a list of `MCCs` or Pliant's payment categories. Both values can be found in the response from the [transaction details endpoint](./get-transactions-detail-batch) or in our [guide section](/docs/card-controls-1).
                      restriction:
                        type: string
                        enum:
                        - ALLOWED
                        - BLOCKED
                  merchants:
                    type:
                    - object
                    - 'null'
                    required:
                    - type
                    - values
                    - restriction
                    properties:
                      type:
                        type: string
                        enum:
                        - MATCH_TERM
                        - MID
                        description: Type of the merchant control to use. `MATCH_TERM` is the merchant name to match. Matching here works by checking if the provided term is part of a merchant name, the check is case insensitive. `MID` represents the merchant identifier as assigned by the card network. It can be found in the [transaction details response](./get-transactions-detail-batch). There it is named `mid`.
                      values:
                        type: array
                        items:
                          type: string
                        description: Values for this merchant control which should be allowed or blocked.
                      restriction:
                        type: string
                        enum:
                        - ALLOWED
                        - BLOCKED
                  dates:
                    type:
                    - object
                    - 'null'
                    required:
                    - type
                    - values
                    - timezone
                    - restriction
                    properties:
                      type:
                        type: string
                        enum:
                        - YEARLY
                        - MONTHLY
                        - WEEKLY
                        - FIXED
                        description: Type of the date control to use. `YEARLY`, `MONTHLY` and `WEEKLY` are recurring dates, whereas `FIXED` is a fixed date range.
                      values:
                        type: array
                        items:
                          type: string
                        description: 'Values for this date control which should be allowed or blocked.

                          `YEARLY`, `MONTHLY` and `FIXED` each take exactly one value. A second value is rejected.

                          `WEEKLY` takes one or more weekdays.

                          Patterns:

                          `YEARLY`: one range `dd.MM-dd.MM`.

                          `MONTHLY`: one range `dd-dd`. Days are `01` to `28`, or `last`, `last-1` or `last-2` for the last day of the month or one to two days before.

                          `WEEKLY`: one or more of `MONDAY`, `TUESDAY`, `WEDNESDAY`, `THURSDAY`, `FRIDAY`, `SATURDAY`, `SUNDAY`.

                          `FIXED`: one range `dd.MM.yyyy-dd.MM.yyyy`.

                          To block transactions at the end of the month, use `MONTHLY` with the single value `20-last`.

                          '
                      timezone:
                        type: string
                        description: Timezone to use for the date control. A list of valid timezones can be found in our [guide section](/docs/card-controls-1).
                      restriction:
                        type: string
                        enum:
                        - ALLOWED
                        - BLOCKED
                  times:
                    type:
                    - object
                    - 'null'
                    required:
                    - type
                    - values
                    - timezone
                    - restriction
                    properties:
                      type:
                        type: string
                        enum:
                        - TIMERANGE
                        description: Type of the time control. Currently only `TIMERANGE` is supported.
                      values:
                        type: array
                        items:
                          type: string
                        description: 'Only one time range is allowed for this control. The allowed pattern is `HH:mm-HH:mm`.

                          So for example if you want to block all transactions between 10pm and 6am, you can use `TIMERANGE` with the value `22:00-06:00`.

                          '
                      timezone:
                        type: string
                        description: Timezone to use for the time control. A list of valid timezones can be found in our [guide section](/docs/card-controls-1).
                      restriction:
                        type: string
                        enum:
                        - ALLOWED
                        - BLOCKED
                  locations:
                    type:
                    - object
                    - 'null'
                    required:
                    - type
                    - values
                    - restriction
                    properties:
                      type:
                        type: string
                        enum:
                        - POSTAL_CODE
                        - REGION
                        description: 'Type of the location-based control.

                          - `POSTAL_CODE`: Then `values` are postal codes

                          - `REGION`: Then `values` are region IDs of your organization

                          '
                      values:
                        type: array
                        items:
                          type: string
                        description: 'Values for this location control which should be allowed or blocked.

                          For `POSTAL_CODE`, each value is matched in full and case-insensitively against the merchant postal code. A shorter value is not a prefix, and `*` is not a wildcard: `68` matches only `68`, and `68*` matches only the literal `68*`.

                          For `REGION`, each value is a region ID of your organization.

                          If the transaction has no merchant postal code, this control does not decline it.

                          Example: to block postal codes `12345` and `67890`, send both values with restriction `BLOCKED`.

                          '
                      restriction:
                        type: string
                        enum:
                        - ALLOWED
                        - BLOCKED
                  countries:
                    type:
                    - object
                    - 'null'
                    required:
                    - restriction
                    - values
                    description: 'Optional object defining country-based transaction restrictions.

                      You can configure cards to either allow transactions only in specified countries (whitelist)

                      or block transactions in specified countries (blacklist).

                      Country codes must be valid ISO 3166-1 alpha-3 codes (e.g., `DEU`, `AUT`, `USA`).

                      This control is not available for US-issued cards.

                      '
                    properties:
                      restriction:
                        type: string
                        enum:
                        - ALLOWED
                        - BLOCKED
                        description: 'Defines the restriction type for the country control.

                          - `ALLOWED`: Only transactions in the listed countries are permitted (whitelist).

                          - `BLOCKED`: Transactions in the listed countries are declined (blacklist).

                          '
                      values:
                        type: array
                        items:
                          type: string
                        description: 'List of ISO 3166-1 alpha-3 country codes (e.g., `DEU`, `AUT`, `USA`).

                          At least one country code must be provided.

                          '
                  currencies:
                    type:
                    - object
                    - 'null'
                    required:
                    - restriction
                    - values
                    description: 'Optional object defining currency-based transaction restrictions.

                      You can configure cards to either allow transactions only in specified currencies (whitelist)

                      or block transactions in specified currencies (blacklist).

                      Currency codes must be valid ISO 4217 codes (e.g., `EUR`, `GBP`, `USD`).

                      '
                    properties:
                      restriction:
                        type: string
                        enum:
                        - ALLOWED
                        - BLOCKED
                        description: 'Defines the restriction type for the currency control.

                          - `ALLOWED`: Only transactions in the listed currencies are permitted (whitelist).

                          - `BLOCKED`: Transactions in the listed currencies are declined (blacklist).

                          '
                      values:
                        type: array
                        items:
                          type: string
                        description: 'List of ISO 4217 currency codes (e.g., `EUR`, `GBP`, `USD`).

                          At least one currency code must be provided.

                          '
                  acceptanceMethods:
                    type:
                    - object
                    - 'null'
                    required:
                    - type
                    - values
                    - restriction
                    description: 'Optional object defining which acceptance methods are permitted.

                      This control is an allow-list only. `restriction` must be `ALLOWED`.

                      The methods in `values` are the only ones permitted; every other method is declined.

                      There is no block-list. Do not send `BLOCKED`: it is not applied, and the methods in `values` are stored as the allowed set.

                      '
                    properties:
                      type:
                        type: string
                        enum:
                        - ACCEPTANCE_METHOD
                        description: 'Type of the acceptance method control to use. Currently only `ACCEPTANCE_METHOD` is supported.

                          '
                      values:
                        type: array
                        items:
                          type: string
                          enum:
                          - ONLINE
                          - MOBILE_WALLET
                          - MANUAL_ENTRY
                          - CONTACTLESS
                          - CHIP_DIP
                          - NOT_AVAILABLE
                          - MAGNETIC_STRIPE
                          - OTHER
                        description: "List of acceptance methods that are allowed for transactions. \nOnly the methods listed here will be permitted if this control is provided.\nPossible values:\n- `ONLINE`: Card-not-present transactions\n- `MOBILE_WALLET`: Payments via mobile wallets (e.g., Apple Pay, Google Pay)\n- `MANUAL_ENTRY`: Card number entered manually\n- `CONTACTLESS`: Tap-based payments\n- `CHIP_DIP`: Inserted chip transactions\n- `NOT_AVAILABLE`: Transactions where acceptance method information is unavailable\n- `MAGNETIC_STRIPE`: Swipe-based payments\n- `OTHER`: Any other unspecified acceptance method\n"
                      restriction:
                        type: string
                        enum:
                        - ALLOWED
                        description: 'Must be `ALLOWED`. Only the methods in `values` are permitted.

                          `BLOCKED` is not a supported restriction and does not block the methods in `values`.

                          '
      responses:
        '204':
          description: No Content. The card controls are saved when this response is returned.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
    get:
      summary: List Card Controls
      description: Returns the card controls for a single card, if it exists.
      tags:
      - Card Controls
      operationId: get-card-controls-by-card
      parameters:
      - name: cardId
        in: path
        required: true
        description: The unique identifier of the card.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                $ref: '#/paths/~1cards~1{cardId}~1card-controls/put/requestBody/content/application~1json/schema/allOf/0'
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
