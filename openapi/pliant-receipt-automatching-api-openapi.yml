tags:
- name: Receipt Automatching
  description: This tag is for operations related to receipt automatching
paths:
  /receipts/automatching:
    post:
      summary: Automatch and Attach File to Transaction
      description: Send us a receipt (PDF, PNG, JPEG) and we try to find the corresponding transaction for this receipt and attach it to the matching transaction. This endpoint works **asynchronously** and only starts the automatching process. You will get a callback with the result once it is finished. Or you can query the status yourself.
      tags:
      - Receipt Automatching
      operationId: upload-receipt-to-automatcher
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - organizationId
              properties:
                file:
                  description: The receipt which should be matched to an existing transaction.
                  type: string
                  format: binary
                organizationId:
                  description: The organization this receipt belongs to. This is the minimum required data we need to automatch a receipt.
                  type: string
                  format: uuid
                metadata:
                  type: object
                  format: json
                  description: Additional metadata about the receipt. This is optional. If provided, it can enhance the matching process. It not provided, we will use OCR data to match the receipt. **This needs to be provided as a JSON string.**
                  properties:
                    amountInMinorUnit:
                      description: The amount stated on the receipt, in the minor value of the currency. E.g. `1000` for 10.00, or `13579` for 135.79 or `5` for 0.05. The currency itself it not necessary for automatching.
                      type: integer
                    merchantName:
                      description: The name of the merchant on the receipt.
                      type: string
                    referenceNumber:
                      description: The number which distinguishes this specific receipt or invoice.
                      type: string
                    transactionReference:
                      description: The number which references the credit card transaction, if provided with the receipt.
                      type: string
                    purchaseDate:
                      description: The date of the purchase etc. in format `yyyy-MM-dd`. Can also be the date of the invoice or receipt itself.
                      type: string
                      format: date
                    cardId:
                      description: The card the transaction was made with.
                      type: string
                      format: uuid
                    cardholderId:
                      description: The [cardholder](/docs/cardholder-entity) that made the transaction.
                      type: string
                      format: uuid
            encoding:
              file:
                contentType: image/png, image/jpeg, application/pdf
              metadata:
                contentType: application/json
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - automatchingTaskId
                properties:
                  automatchingTaskId:
                    type: string
                    format: uuid
                    description: The id of the automatching task for later fetching the status of this task. You will also get a callback if subscribed.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /receipts/automatching/metadata:
    post:
      summary: Automatch Metadata to Transaction
      description: Provide us with metadata about a receipt and we try to find the corresponding transaction for this metadata. Nothing is attached to the transaction, we just provide a matching `transactionId` if found. The more data provided, the better the matching result. This endpoint works **asynchronously** and only starts the automatching process. You will get a callback with the result once it is finished. Or you can query the status yourself.
      tags:
      - Receipt Automatching
      operationId: metadata-receipt-to-automatcher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - organizationId
              - metadata
              properties:
                organizationId:
                  description: The organization this receipt metadata belongs to.
                  type: string
                  format: uuid
                metadata:
                  type: object
                  description: Metadata to find a matching transaction. The more data provided, the better the matching result.
                  required:
                  - amountInMinorUnit
                  properties:
                    amountInMinorUnit:
                      description: The amount stated on the receipt, in the minor value of the currency. E.g. `1000` for 10.00, or `13579` for 135.79 or `5` for 0.05. The currency itself it not necessary for automatching.
                      type: integer
                    merchantName:
                      description: The name of the merchant on the receipt.
                      type: string
                    referenceNumber:
                      description: The number which distinguishes this specific receipt or invoice.
                      type: string
                    transactionReference:
                      description: The number which references the credit card transaction, if provided with the receipt.
                      type: string
                    purchaseDate:
                      description: The date of the purchase etc. in format ´yyyy-MM-dd´. Can also be the date of the invoice or receipt itself.
                      type: string
                      format: date
                    cardId:
                      description: The card the transaction was made with.
                      type: string
                      format: uuid
                    cardholderId:
                      description: The [cardholder](/docs/cardholder-entity) that made the transaction.
                      type: string
                      format: uuid
                    cardAccountId:
                      description: The ID of the [card account](/docs/card-account) this transaction belongs to.
                      type: string
                      format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - automatchingTaskId
                properties:
                  automatchingTaskId:
                    type: string
                    format: uuid
                    description: The id of the automatching task for later fetching the status of this task. You will also get a callback if subscribed.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /receipts/automatching/subscription:
    post:
      summary: 'Callback: Add/Update'
      description: Subscribe to callbacks for this entity or change an existing callback.
      tags:
      - Receipt Automatching
      operationId: create-receipt-automatching-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
                  description: The URL to send the callback to. Must be a valid and reachable URL. We do some basic validation to ensure the URL is syntactically correct and reachable for Pliant. Only HTTPS URLs are supported.
                eventTypes:
                  type: array
                  description: The event types to subscribe to.
                  items:
                    type: string
                    enum:
                    - RECEIPT_AUTOMATCHING_FINISHED
              required:
              - callbackUrl
              - eventTypes
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      callbacks:
        receiptUpdated:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                content:
                  application/json:
                    schema:
                      type: object
                      required:
                      - automatchingTaskId
                      - organizationId
                      - status
                      - transactionIds
                      properties:
                        automatchingTaskId:
                          type: string
                          format: uuid
                          description: The id of the automatching task.
                        organizationId:
                          type: string
                          format: uuid
                          description: The id of the organization this task belongs to.
                        matchedTransactions:
                          type: array
                          description: The transactions that were matched to the provided data. Can also be empty, if no match was found. In most cases this contains 0..1 matches, but some receipts or invoices refer to more than one transaction. This is then reflected here.
                          items:
                            type: object
                            properties:
                              transactionId:
                                type: string
                                format: uuid
                                description: The id of the transaction that is a possible match to the provided data.
                              score:
                                type: number
                                format: float
                                description: The score (from 0..1) of this match. The higher the score, the more likely the match is correct.
                        status:
                          type: string
                          enum:
                          - IN_PROGRESS
                          - ERROR_DURING_PROCESSING
                          - MATCHING_TRANSACTION_FOUND
                          - MATCHING_TRANSACTION_NOT_FOUND
                          description: The status of the automatching task.
                        additionalInformation:
                          type: string
                          description: Additional information about the status. E.g. an error message or a reason why no match was found.
              responses:
                '200':
                  description: Ok
    delete:
      summary: 'Callback: Remove'
      description: Remove a callback subscription for this entity.
      tags:
      - Receipt Automatching
      operationId: remove-receipt-automatching-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventTypes:
                  type: array
                  description: The event types to unsubscribe from.
                  items:
                    type: string
                    enum:
                    - RECEIPT_AUTOMATCHING_FINISHED
              required:
              - eventTypes
      responses:
        '200':
          description: Ok
  /receipts/automatching/{automatchingTaskId}:
    get:
      summary: Get Status of Automatching Task
      description: Query the status of the automatching task specified by path parameter `automatchingTaskId`.
      tags:
      - Receipt Automatching
      operationId: get-receipt-automatcher-status
      parameters:
      - name: automatchingTaskId
        in: path
        required: true
        description: The id of the automatching task.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                - automatchingTaskId
                - organizationId
                - status
                properties:
                  automatchingTaskId:
                    type: string
                    format: uuid
                    description: The id of the automatching task.
                  organizationId:
                    type: string
                    format: uuid
                    description: The id of the organization this task belongs to.
                  matchedTransactions:
                    type: array
                    description: The transactions that were matched to the provided data. Can also be empty, if no match was found. In most cases this contains 0..1 matches, but some receipts or invoices refer to more than one transaction. This is then reflected here.
                    items:
                      type: object
                      required:
                      - transactionId
                      - score
                      properties:
                        transactionId:
                          type: string
                          format: uuid
                          description: The id of the transaction that is a possible match to the provided data.
                        score:
                          type: number
                          format: float
                          description: The score (from 0..1) of this match. The higher the score, the more likely the match is correct.
                  status:
                    type: string
                    enum:
                    - IN_PROGRESS
                    - ERROR_DURING_PROCESSING
                    - ERROR_FEATURE_NOT_ACTIVE
                    - MATCHING_TRANSACTION_FOUND
                    - MATCHING_TRANSACTION_NOT_FOUND
                    description: The status of the automatching task.
                  additionalInformation:
                    type: string
                    description: Additional information about the status. E.g. a more detailed error message or a reason why no match was found.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
