tags:
- name: Test Data Generator (Sandbox-only)
  description: This tag is for operations related to test data generation
paths:
  /test-data-generator/organizations/prefund:
    post:
      summary: Simulate Prefund Payment
      description: 'Simulate a prefund payment to an existing organizations card account. The payment will appear in the system within 10 minutes after the request was sent.

        This endpoint is ONLY available on our sandbox environment and NOT on production. See documentation for details.'
      tags:
      - Test Data Generator (Sandbox-only)
      operationId: simulate-prefund-payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - organizationId
              - amount
              properties:
                organizationId:
                  type: string
                  format: uuid
                  description: The id of the organization for which the payment should occur.
                cardAccountId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: The id of the card account of the organization to use. If not provided, the default card account of the organization will be used. If provided, it has precedence over the `organizationId` parameter.
                amount:
                  type: object
                  description: The amount to prefund the card account with. The currency must match the currency of the card account.
                  properties:
                    value:
                      type: number
                      description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                    currency:
                      type: string
                      description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                fromAccount:
                  type:
                  - string
                  - 'null'
                  description: 'If provided, the prefund will be simulated from this account. Example: `DE89370400440532013000` (has to be a valid IBAN – to generate an IBAN please check [here](http://randomiban.com/?country=Germany)'
                transfersAllowedStatus:
                  type:
                  - string
                  - 'null'
                  description: "Status of the newly added bank account for this prefund payment (when this parameter is given `fromAccount` will be defined by the system if not given in this request).\nPossible statuses are `REVIEW`, `AUTHORIZED`, `BLOCKED`. \n- `REVIEW` is a default status that will require manual intervention. \n- `AUTHORIZED` will make the payment appear on the balance directly. \n- `BLOCKED` will block the account and all current and future payments from it.\nDefaults to `AUTHORIZED`.\n"
                  enum:
                  - REVIEW
                  - AUTHORIZED
                  - BLOCKED
      responses:
        '200':
          description: Ok
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /test-data-generator/transactions:
    post:
      summary: Generate Test Transactions
      description: 'Generate one or multiple test transactions to test certain endpoints and/or callbacks which deal with transactions.

        This endpoint is ONLY available on our sandbox environment and NOT on production. See documentation for details.


        `PURCHASE` and `CASH_WITHDRAWAL` amounts must be negative or zero. `PURCHASE_REFUND` and `PURCHASE_CHARGEBACK` amounts must be positive.

        `merchant` accepts only `name` and `externalId`. Merchant country and MCC cannot be set; they are chosen at random. A card restricted to one country will decline generated purchases whenever that random country is outside the list.


        Hint: The Pliant web app shows confirmed transactions as pending, since we only switch this status if the transaction is booked/settled. Keep this in mind when using this generator!'
      tags:
      - Test Data Generator (Sandbox-only)
      operationId: generate-test-transactions-in-sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardToken:
                  type: string
                  description: The 9-digit `token` value from the credit card the transaction(s) should be generated for. You can obtain this token from the [card details endpoint](/reference/get-multiple-card-details). This is NOT the UUID of the card (`cardId`).
                numberOfTransactions:
                  type: integer
                  description: How many transactions should be generated?
                status:
                  type: string
                  description: Status of the transaction(s).
                  enum:
                  - PENDING
                  - CONFIRMED
                  - DECLINED
                  - REVERSED
                type:
                  type: string
                  description: Type of the transaction(s).
                  enum:
                  - PURCHASE
                  - CASH_WITHDRAWAL
                  - PURCHASE_CHARGEBACK
                  - PURCHASE_REFUND
                  - STATUS_INQUIRY
                transactionCategory:
                  type: string
                  description: Category of the transaction(s).
                  enum:
                  - ADVERTISING_AND_MARKETING
                  - COMPUTING_AND_SOFTWARE
                  - EDUCATION_AND_TRAINING
                  - ELECTRONICS_AND_IT_EQUIPMENT
                  - ENTERTAINMENT_AND_WELLNESS
                  - FOOD_AND_DRINKS
                  - GIFTS_AND_VOUCHERS
                  - MATERIALS_AND_PACKAGING
                  - OFFICE_SUPPLIES_AND_EQUIPMENT
                  - SERVICES
                  - TRAVEL_AND_ACCOMMODATION
                  - HEALTHCARE
                  - OTHER
                amount:
                  type: object
                  properties:
                    value:
                      type: number
                      description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                    currency:
                      type: string
                      description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                fxAmount:
                  type: object
                  properties:
                    value:
                      type: number
                      description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                    currency:
                      type: string
                      description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                amountRange:
                  type: object
                  properties:
                    from:
                      type: number
                    to:
                      type: number
                    currency:
                      type: string
                      description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                merchant:
                  type: object
                  additionalProperties: false
                  description: 'Only `name` and `externalId` are applied. Merchant country and MCC cannot be set on this endpoint and are chosen at random.

                    '
                  properties:
                    name:
                      type: string
                      maxLength: 100
                      description: Name of the merchant of this transaction.
                    externalId:
                      type: string
                      maxLength: 15
                      description: Identifier of the merchant at which this transaction occurred.
              required:
              - cardToken
      responses:
        '200':
          description: Ok
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /test-data-generator/transactions/{transactionId}/status:
    post:
      summary: Simulate Transaction Status Transition
      description: 'Change the status of an existing transaction in the sandbox environment from `PENDING` to `CONFIRMED`, `REVERSED` or `DECLINED`.

        This endpoint is ONLY available on our sandbox environment and NOT on production. See documentation for details.


        Hint: The Pliant web app shows confirmed transactions as pending, since we only switch this status if the transaction is booked/settled. Keep this in mind when using this generator!'
      tags:
      - Test Data Generator (Sandbox-only)
      operationId: simulate-transaction-status-transition
      parameters:
      - name: transactionId
        in: path
        required: true
        description: The unique identifier of the transaction to change. The transaction has to be in status `PENDING`.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: The new status of the transaction. The initial status of the transaction is `PENDING`. The status can be changed to `CONFIRMED` or `REVERSED` or `DECLINED`.
                  enum:
                  - CONFIRMED
                  - REVERSED
                  - DECLINED
      responses:
        '200':
          description: Ok
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
