  /cards/{cardholderId}/instant:
    post:
      summary: Issue Card (Instant)
      description: 'This endpoint offers similar card issuing functionality as the main card issuing endpoint, but specifically allows for a _synchronous_ and _instant_ card issuing,

        whereas the main card issuing flow works asynchronously and requires the consumption of a callback to confirm the card is actually active.

        This endpoint issues cards instantly in a synchronous fashion. Meaning the card is active and usable when this endpoint returns a `200 Ok` response.

        The use case being here a fully automated card issuing flow, followed by an immediate card usage on API level for normally PCI-DSS certified companies.

        Please note, that the sensitive card data still needs to be fetched separately after issuing a new card (if PCI-DSS compliant).


        **This endpoint should only be used if aligned with Pliant upfront. In 90% of cases, you want to use the normal card issuing endpoint instead, as linked above.**'
      tags:
      - Cards
      operationId: issue-card-instant
      parameters:
      - name: cardholderId
        in: path
        required: true
        description: The id of the [cardholder](/docs/cardholder-entity) to issue the card for. This cardholder needs to have a phone number, otherwise 3DS security mechanism during a purchase will not work.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/paths/~1cards~1{cardholderId}/post/requestBody/content/application~1json/schema/allOf/0'
      responses:
        '200':
          description: Ok. The card can be directly used now.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/paths/~1cards~1instant/post/responses/200/content/application~1json/schema'
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /cards/{cardholderId}/instant-pci:
    post:
      summary: Issue Card (Instant as PCI-DSS)
      description: 'This endpoint offers similar card issuing functionality as the main card issuing endpoint, but specifically allows for a _synchronous_ and _instant_ card issuing,

        **including PCI-DSS compliant sensitive card data retrieval**, which can be then found in the response as object `sensitiveCardData`.

        This endpoint issues cards instantly in a synchronous fashion and returns the sensitive card data like the cards PAN and CVV directly.

        Meaning the card is active and usable when this endpoint returns a `200 Ok` response and you can directly use the card data to do a purchase of any kind.

        The use case being here a fully automated card issuing flow, followed by an immediate card usage on API level.


        **This endpoint can only be used after a separate configuration done by Pliant and the partner using this endpoint needs to be PCI-DSS certified!**


        **A dedicated host URL `pci-api.getpliant.com` is used for this endpoint!** Please refer to the documentation for more information.'
      tags:
      - Cards
      operationId: issue-card-instant-with-pci
      parameters:
      - name: cardholderId
        in: path
        required: true
        description: The id of the [cardholder](/docs/cardholder-entity) to issue the card for. This cardholder needs to have a phone number, otherwise 3DS security mechanism during a purchase will not work.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/paths/~1cards~1{cardholderId}/post/requestBody/content/application~1json/schema/allOf/0'
      responses:
        '200':
          description: Ok. The card can be directly used now.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/paths/~1cards~1instant-pci/post/responses/200/content/application~1json/schema'
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '422':
          $ref: '#/paths/~1cards/post/responses/422'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
