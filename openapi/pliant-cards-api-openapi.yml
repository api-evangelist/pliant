  /cards/{cardId}/replace:
    post:
      summary: Replace Card
      description: 'Replace or renew an existing card. This endpoints terminates the card being replaced and creates a new card with the same settings and card type, but different sensitive card information under the same cardholder. This can be useful to replace for instance a stolen credit card.

        The following callbacks will be triggered by this action:

        - For the terminated card: `CARD_TERMINATED`, `CARD_STATUS_CHANGED` to terminated and `CARD_BALANCE_UPDATED` to set the card balance to zero.

        - For the newly created card: `CARD_ISSUED`, `CARD_ACTIVATED`, `CARD_STATUS_CHANGED` and `CARD_BALANCE_UPDATED` with the corresponding balance.'
      tags:
      - Cards
      operationId: replace-card
      parameters:
      - name: cardId
        in: path
        required: true
        description: The unique identifier of the card.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                terminateCardReason:
                  type: string
                  enum:
                  - DAMAGED
                  - EXPIRING_SOON
                  - LOST
                  - STOLEN
                  - OTHER
                  description: "The reason why the card is being replaced. Depending on the card type there are different valid reasons.\n\n`DAMAGED` can be used for physical cards.\n`EXPIRING_SOON`\tcan be used for physical and virtual cards, plus the cards has to expiry within the next three months.\n`LOST` can be used for physical cards.\n`STOLEN` can be used for all types of cards.\n`OTHER` can be used for all types of cards.\n\nA replacement of a card is only possible if the card is _not_ in one of the following statuses: `PENDING_ISSUANCE`, `PENDING_REGISTRATION`, `REQUESTED`.\nAlso, single-use cards cannot be replaced at all.\n"
                expiryPeriodMonths:
                  type: integer
                  description: The number of months the new card should be valid for. This needs to follow the guidelines from normal [card issuing](./issue-card).
              required:
              - terminateCardReason
              - expiryPeriodMonths
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardId:
                    type: string
                    format: uuid
                  type:
                    type:
                    - string
                    - 'null'
                    deprecated: true
                    enum:
                    - VIRTUAL
                    - SINGLE_USE
                    - PHYSICAL
                    - BLACK
                    - TRAVEL
                    description: 'Deprecated, please use `cardConfig` instead.

                      `VIRTUAL` - Virtual credit card

                      `SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)

                      `PHYSICAL` - Physical credit card

                      `BLACK` - Physical black premium credit card

                      `TRAVEL` - Virtual cards used specifically in travel industry related use cases

                      '
                  cardholderId:
                    type: string
                    format: uuid
                  organizationId:
                    type: string
                    format: uuid
                  transactionLimit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: '* `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month

                      * `QUARTERLY` - The card limit is renewed every calendar quarter

                      * `ANNUAL` - The card limit is renewed every year

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                  expiryDate:
                    type: string
                    format: date-time
                  label:
                    type:
                    - string
                    - 'null'
                    description: Available only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`. The maximum length is 40 characters.
                    maxLength: 40
                  purpose:
                    type:
                    - string
                    - 'null'
                    description: Available only for cards with type `SINGLE_USE`
                  cardDesign:
                    type: string
                  cardDesignId:
                    type: string
                    format: uuid
                    description: The unique identifier of the card design used for this specific card.
                  productRef:
                    type: string
                    deprecated: true
                    description: This field is deprecated and will be removed in the future. Use `cardDesignId` instead.
                  platformFee:
                    type: boolean
                  cardConfig:
                    type: string
                    description: Please contact your Pliant contact person for details
                  replacedByCardId:
                    type: string
                    format: uuid
                    description: Filled, if this card was replaced by another card.
                  replacedCardId:
                    type: string
                    format: uuid
                    description: Filled, if this card replaced another card.
                  replacementReason:
                    type: string
                    description: Describes the reason for the card replacement.
                    enum:
                    - DAMAGED
                    - EXPIRING_SOON
                    - LOST
                    - OTHER
                    - STOLEN
                  cardAccountId:
                    type: string
                    format: uuid
                    description: The unique identifier of the card account.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /cards/{cardId}/terminate:
    post:
      summary: Terminate Card
      description: Via this endpoint you can terminate a card. This cannot be undone. Card termination is a final step.
      tags:
