                                    * `TOTAL` - The limit is never renewed.

                                    '
                                limitRenewDate:
                                  type:
                                  - string
                                  - 'null'
                                  format: date
                                  description: Date when this additional limit's balance will next be renewed, e.g. `2026-06-01`. Null for `TOTAL` frequency limits.
                                limit:
                                  type:
                                  - object
                                  - 'null'
                                  description: The monetary cap for this additional limit.
                                  properties:
                                    value:
                                      type: number
                                      description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                                    currency:
                                      type: string
                                      description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                                maxTransactionCount:
                                  type:
                                  - number
                                  - 'null'
                                  minimum: 1
                                  maximum: 999999999
                                  description: Maximum number of transactions allowed under this additional limit within its renewal period. Null if no transaction-count cap is configured.
                                scope:
                                  type:
                                  - object
                                  - 'null'
                                  description: The scope restriction of this additional limit. Null when no scope is defined.
                                  properties:
                                    categories:
                                      type: array
                                      description: Merchant category types this limit applies to.
                                      items:
                                        type: string
                                        enum:
                                        - ADVERTISING_AND_MARKETING
                                        - COMPUTING_AND_SOFTWARE
                                        - EDUCATION_AND_TRAINING
                                        - ELECTRONICS_AND_IT_EQUIPMENT
                                        - ENTERTAINMENT_AND_WELLNESS
                                        - FOOD_AND_DRINKS
                                        - GIFTS_AND_VOUCHERS
                                        - HEALTHCARE
                                        - MATERIALS_AND_PACKAGING
                                        - OFFICE_SUPPLIES_AND_EQUIPMENT
                                        - SERVICES
                                        - TRAVEL_AND_ACCOMMODATION
                                        - OTHER
                                    acceptanceMethods:
                                      type: array
                                      description: The card acceptance methods this limit applies to.
                                      items:
                                        type: string
                                        enum:
                                        - ONLINE
                                        - MOBILE_WALLET
                                        - MANUAL_ENTRY
                                        - CONTACTLESS
                                        - CHIP_DIP
                                        - NOT_AVAILABLE
                                        - MAGNETIC_STRIPE
                                        - OTHER
                                    atmWithdrawal:
                                      type: boolean
                                      description: When `true`, this additional limit applies to ATM withdrawal transactions.
                                    currency:
                                      type:
                                      - string
                                      - 'null'
                                      description: ISO 4217 currency code this limit is scoped to, e.g. `PLN`. Null when no currency scope is defined.
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        cardAccessLinkRequested:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - $ref: '#/paths/~1cards~1subscription/post/callbacks/cardReassigned/{$request.body#~1callbackUrl}/post/parameters/0'
              - $ref: '#/paths/~1cards~1subscription/post/callbacks/cardReassigned/{$request.body#~1callbackUrl}/post/parameters/1'
              - $ref: '#/paths/~1cards~1subscription/post/callbacks/cardReassigned/{$request.body#~1callbackUrl}/post/parameters/2'
              - $ref: '#/paths/~1cards~1subscription/post/callbacks/cardReassigned/{$request.body#~1callbackUrl}/post/parameters/3'
              - $ref: '#/paths/~1cards~1subscription/post/callbacks/cardReassigned/{$request.body#~1callbackUrl}/post/parameters/4'
              requestBody:
                description: 'This callback object is used for the following event types: `CARD_ACCESS_LINK_REQUESTED`.

                  Fired when a new card access link has been requested. The payload includes the data required to send out an access link to the cardholder.

                  '
                content:
                  application/json:
                    schema:
                      allOf:
                      - $ref: '#/paths/~1cards~1subscription/post/callbacks/cardUpdated/{$request.body#~1callbackUrl}/post/requestBody/content/application~1json/schema/allOf/0'
                      - properties:
                          cardId:
                            type: string
                            format: uuid
                            description: The Pliant card id (UUIDv4) of the card.
                          cardholderId:
                            type: string
                            format: uuid
                            description: The id (UUIDv4) of the cardholder this card has been issued for.
                          organizationId:
                            type: string
                            format: uuid
                            description: The id (UUIDv4) of the organization this cardholder and card belong to.
                          accessLink:
                            type: string
                            description: The access link to that the user can use to access the card.
                          expiryDate:
                            type: string
                            description: The point in time this access link expires.
                            example: '2026-01-01T00:00:00Z'
                            format: date-time
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
        cardReassigned:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                description: 'This callback object is used for the following event types: `CARD_REASSIGNED`.

                  Fired once per card when the card is moved from one [card account](/docs/card-account) to another, for example when a card account is superseded by a successor card account.

                  The card itself is unchanged - card number, expiry date, limits and status stay the same - only the card account the card belongs to changes.

                  Partners that store a card to card account mapping should update it to `cardAccountId` when receiving this event.

                  '
                content:
                  application/json:
                    schema:
                      allOf:
                      - $ref: '#/paths/~1cards~1subscription/post/callbacks/cardUpdated/{$request.body#~1callbackUrl}/post/requestBody/content/application~1json/schema/allOf/0'
                      - properties:
                          cardId:
                            type: string
                            format: uuid
                            description: The Pliant card id (UUIDv4) of the card that was reassigned.
                          organizationId:
                            type: string
                            format: uuid
                            description: The id (UUIDv4) of the organization this card belongs to.
                          previousCardAccountId:
                            type: string
                            format: uuid
                            description: The id of the [card account](/docs/card-account) the card was assigned to before the reassignment. This card account is `SUPERSEDED` from this point on and keeps the history of the card, e.g. its past transactions, statements and account entries.
                          cardAccountId:
                            type: string
                            format: uuid
                            description: The id of the [card account](/docs/card-account) the card is assigned to now. This is the successor card account, referenced as `supersededBy` on the previous card account. Balance, limits and bank account information of the card are served from this card account from now on.
                          reassignedAt:
                            type: string
                            format: date-time
                            description: The point in time the card was reassigned to the new card account.
                            example: '2026-01-01T00:00:00Z'
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
    delete:
      summary: 'Callback: Remove'
      description: Remove a callback subscription for this entity.
      tags:
      - Cards
      operationId: remove-cards-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventTypes:
                  type: array
                  description: The event types to unsubscribe from.
                  items:
                    type: string
                    enum:
                    - CARD_CREATED
                    - CARD_ISSUED
                    - CARD_ACTIVATED
                    - CARD_LOCKED
                    - CARD_UNLOCKED
                    - CARD_TERMINATED
                    - CARD_EXPIRED
                    - CARD_LIMIT_CHANGED
                    - CARD_LIMIT_CHANGE_FAILED
                    - CARD_DETAILS_CHANGED
                    - CARD_BALANCE_UPDATED
                    - CARD_AVAILABLE_BALANCE_CHANGED
                    - CARD_STATUS_CHANGED
                    - CARD_VALIDITY_UPDATED
                    - CARD_SHIPPED
                    - CARD_CLICK_TO_PAY_INFO_CHANGED
                    - CARD_BENEFIT_LOADED
                    - CARD_BENEFIT_UNLOADED
                    - CARD_LIMITS_CHANGED
                    - CARD_ACCESS_LINK_REQUESTED
                    - CARD_REASSIGNED
              required:
              - eventTypes
      responses:
        '200':
          description: Ok
  /cards/{cardId}:
    get:
      summary: Card Details (Single)
      deprecated: true
      description: 'Returns details for a single card. For details of multiple cards, use our batch-style endpoint.


        **This endpoint has changed in comparison to the previous version of the API.** The following changes were made:

        - added `cardControls` to response body

        - changed the enumeration for the status field in the response body

        - deprecated `type` and replaced it with `cardConfig`'
      tags:
      - Cards
      operationId: get-single-card-details
      parameters:
      - name: cardId
        in: path
        required: true
        description: The unique identifier of the card.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardId:
                    type: string
                    format: uuid
                    description: The unique identifier of the card.
                  cardRequestId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: If this card originated from a card request, this field contains the unique identifier of the card request.
                  organizationId:
                    type: string
                    format: uuid
                    description: The unique identifier of the organization, this card belongs to.
                  cardholderId:
                    type: string
                    format: uuid
                    description: The unique identifier of the cardholder, this card belongs to.
                  cardAccountId:
                    type: string
                    format: uuid
                    description: The unique identifier of the card account, this card belongs to.
                  type:
                    type:
                    - string
                    - 'null'
                    deprecated: true
                    description: 'Deprecated, please use `cardConfig` instead.

                      `VIRTUAL` - Virtual credit card

                      `SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)

                      `PHYSICAL` - Physical credit card

                      `BLACK` - Physical black premium credit card

                      `TRAVEL` - Virtual cards used specifically in travel industry related use cases

                      '
                    enum:
                    - VIRTUAL
                    - SINGLE_USE
                    - PHYSICAL
                    - BLACK
                    - TRAVEL
                  cardConfig:
                    type: string
                    description: The Pliant card configuration of this card. This describes all feature of this card in one single configuration, e.g. the type of the card and also the design of the card etc. It replaces the deprecated card `type`. Please refer to the [guide section](/docs/card-entity) to learn more about possible values.
                  status:
                    type: string
                    description: 'The status of the card.


                      **Deprecation Notice:** The status values `PENDING_ACTIVATION`, `PENDING_ISSUANCE`, and `PENDING_REGISTRATION` are deprecated and will be mapped to `PENDING` with appropriate `pendingDetails` in the future. Use `PENDING` with the corresponding `pendingDetails` value instead.

                      '
                    enum:
                    - PENDING
                    - PENDING_ACTIVATION
                    - PENDING_ISSUANCE
                    - PENDING_REGISTRATION
                    - REQUEST_APPROVED
                    - REQUESTED
                    - REQUEST_CANCELLED
                    - REQUEST_REJECTED
                    - ACTIVE
                    - LOCKED
                    - LOCKED_PIN
                    - EXPIRED
                    - TERMINATED
                    - TERMINATED_LOST
                    - TERMINATED_STOLEN
                    x-enumDescriptions:
                      PENDING: Card is in a pending state. Check `pendingDetails` for the specific reason.
                      PENDING_ACTIVATION: '~~(Deprecated) Use `PENDING` with `pendingDetails: PENDING_ACTIVATION` instead.~~'
                      PENDING_ISSUANCE: '~~(Deprecated) Use `PENDING` with `pendingDetails: PENDING_ISSUANCE` instead.~~'
                      PENDING_REGISTRATION: '~~(Deprecated) Use `PENDING` with `pendingDetails: PENDING_REGISTRATION` instead.~~'
                      REQUEST_APPROVED: Card request has been approved.
                      REQUESTED: Card has been requested.
                      REQUEST_CANCELLED: Card request has been cancelled.
                      REQUEST_REJECTED: Card request has been rejected.
                      ACTIVE: Card is active and can be used.
                      LOCKED: Card is locked.
                      LOCKED_PIN: Card is locked due to PIN issues.
                      EXPIRED: Card has expired.
                      TERMINATED: Card has been terminated.
                      TERMINATED_LOST: Card has been terminated because it was lost.
                      TERMINATED_STOLEN: Card has been terminated because it was stolen.
                  pendingDetails:
                    type:
                    - string
                    - 'null'
                    description: 'The internal reason for a card''s pending state. This field is only populated when `status` is `PENDING` or one of the deprecated `PENDING_...` statuses, and will be `null` for all non-pending statuses.

                      '
                    enum:
                    - PENDING_ACTIVATION
                    - PENDING_ISSUANCE
                    - PENDING_REGISTRATION
                    - PENDING_VALIDITY
                    - PENDING_SANCTION_SCREEN
                    - PENDING_INFORMATION
                    x-enumDescriptions:
                      PENDING_ACTIVATION: Card is pending activation.
                      PENDING_ISSUANCE: Card is pending issuance.
                      PENDING_REGISTRATION: Card is pending registration.
                      PENDING_VALIDITY: Card is pending validity period.
                      PENDING_SANCTION_SCREEN: Card is pending sanction screening.
                      PENDING_INFORMATION: Card is pending additional information.
                  label:
                    type:
                    - string
                    - 'null'
                    description: A short text describing the card. Available only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`. The maximum length is 40 characters.
                    maxLength: 40
                  purpose:
                    type:
                    - string
                    - 'null'
                    description: A short text describing the card. Available only for virtual cards with a `cardConfig` containing `SINGLE_USE`, the maximum length is 40 characters.
                    maxLength: 40
                  refNum:
                    type:
                    - string
                    - 'null'
                    description: The last 4 digits of the PAN (payment card number), better known as the credit card number. It can be `null` e.g. for terminated cards.
                  issuingDate:
                    type:
                    - string
                    - 'null'
                    description: Date-time of card issuing, e.g. `2023-08-23T14:28:53.600608Z`. Can be null e.g. for cards which are requested by a [cardholder](/docs/cardholder-entity) but the request is declined.
                    format: date-time
                  expiryDate:
                    type:
                    - string
                    - 'null'
                    description: Date-time (without nanoseconds) when card expires, e.g. `2026-07-31T23:59:59Z`. For cards with type `SINGLE_USE` this is set to 12 months automatically and every value put here is ignored. Can be null e.g. for cards which are requested by a [cardholder](/docs/cardholder-entity) but the request is declined.
                    format: date-time
                  limit:
                    type: object
                    description: The limit of the card, describing the overall limit of this card. It might get reset regularly depending on the field `limitRenewFrequency`.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  transactionLimit:
                    type: object
                    description: The transaction limit of the card, describing the maximum amount a single transaction can have on this card.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  spendingBalance:
                    type: object
                    description: The spending balance of the card.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  availableBalance:
                    type: object
                    description: The available balance of the card.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  token:
                    type: string
                    description: The network token of the card.
                  cardDesign:
                    type: string
                    description: The card design of the card on Thredd (Pliant's credit card processor) side.
                  productRef:
                    type: string
                    deprecated: true
                    description: The product reference of the card on Thredd (Pliant's credit card processor) side. This field is deprecated and will be removed in the future. Use `cardDesignId` instead.
                  platformFee:
                    type: boolean
                    description: Whether the card is used for the internal Pliant platform fee or not.
                  limitPeriodEnd:
                    type: string
                    description: Date-time (without nanoseconds) when the current limit period ends, e.g. `2023-09-30T23:59:59Z`.
                    format: date-time
                  limitRenewDate:
                    type: string
                    description: Date when the limit will be renewed, e.g. `2023-10-01`.
                    format: date
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: "Describes how often the limit of the card is renewed.\n  * `DAILY` - The card limit is renewed every day\n  * `WEEKLY` - The card limit is renewed every week\n  * `MONTHLY` - The card limit is renewed every calendar month\n  * `QUARTERLY` - The card limit is renewed every calendar quarter\n  * `ANNUAL` - The card limit is renewed every year\n  * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.\n"
                  customFirstName:
                    type:
                    - string
                    - 'null'
                    description: Optional first name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                  customLastName:
                    type:
                    - string
                    - 'null'
                    description: Optional last name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                  replacedByCardId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: Filled, if this card was replaced by another card.
                  replacedCardId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: Filled, if this card replaced another card.
                  replacementReason:
                    type:
                    - string
                    - 'null'
                    description: Describes the reason for the card replacement, if any happened.
                    enum:
                    - DAMAGED
                    - EXPIRING_SOON
                    - LOST
                    - OTHER
                    - STOLEN
                  shippingDate:
                    type:
                    - string
                    - 'null'
                    description: Date-time when the physical card was shipped, e.g. `2023-10-16T11:34:59.595Z`. This field is empty for all other types of cards, or when the physical card is not shipped yet.
                    format: date-time
                  panAlias:
                    type:
                    - string
                    - 'null'
                    description: The PAN alias of the card. This is not the real credit card number (PAN) but a alias version of it.
                  validFrom:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases. Outside of this date range, the card cannot be used for any purchases, only for zero-amount card-checks, and is shown with `status` `PENDING`. If not provided, the card is active immediately. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the provided date is already a valid day to use the card. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The earliest possible date is the current date. The `validFrom` date needs to be before the `validTo` date. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                    example: '2023-12-01'
                  validTo:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases. After the specified date, the card is automatically terminated. If not provided, the card is active until the `validityPeriod` ends. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the card will be terminated one day after this date. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The earliest possible date is the current date. The latest possible date is the end date of the `validityPeriod`. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                    example: '2023-12-31'
                  validTimezone:
                    type: string
                    description: Optional field to describe the timezone for the `validFrom` and `validTo` fields. This field is mandatory if `validFrom` and `validTo` fields are used. A list of valid timezones can be found in our [guide section](/docs/card-controls-1).
                  maxTransactionCount:
                    type: number
                    minimum: 1
                    maximum: 999999999
                    description: Optional field to describe the maximum number of transactions within the range of `1..999999999` that can be performed with this card. If not provided, the card can be used for an unlimited number of transactions until the card expires.
                  fundingType:
                    type: string
                    description: '* `CHARGE` - normal (non-benefit) credit card

                      * `LOAD_BASED_ACCRUING` - benefit card where money not spent is transferred to the next month

                      * `LOAD_BASED_NON_ACCRUING` - benefit card where money not spent is lost end of month

                      * `BALANCE_BASED` - benefit card with a standing balance that persists across months and is spent down until depleted (no monthly reset).

                      '
                    enum:
                    - CHARGE
                    - LOAD_BASED_ACCRUING
                    - LOAD_BASED_NON_ACCRUING
                    - BALANCE_BASED
                  clickToPayInfo:
                    $ref: '#/paths/~1cards/post/responses/200/content/application~1json/schema/properties/clickToPayInfo'
                  nextLoadDate:
                    type: string
                    format: date
                    description: For cards that are loaded periodically, indicates the date when the card will be loaded the next time.
                  additionalLimits:
                    type: array
                    description: Additional limits on this card. Empty when none are configured. Re-fetch or subscribe to `CARD_LIMITS_CHANGED` to get the latest state after a limit change.
                    items:
                      $ref: '#/paths/~1cards/post/responses/200/content/application~1json/schema/properties/additionalLimits/items'
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
