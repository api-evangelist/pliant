  /cards/subscription:
    post:
      summary: 'Callback: Add/Update'
      description: Subscribe to callbacks for this entity or change an existing callback.
      tags:
      - Cards
      operationId: create-card-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
                  description: The URL to send the callback to. Must be a valid and reachable URL. We do some basic validation to ensure the URL is syntactically correct and reachable for Pliant. Only HTTPS URLs are supported.
                eventTypes:
                  type: array
                  items:
                    type: string
                    description: "The event types to subscribe to.\nThe initial flow of events for cards is: \n`CARD_CREATED` - as soon as the card is created within Pliant, \n`CARD_ISSUED` - when the card is issued with the card issuer, and \n`CARD_ACTIVATED` - when the card is activated by the system or [cardholder](/docs/cardholder-entity) (virtual cards get activated automatically by the system, physical card are activated by the cardholder).\nAll other callback types can occur later over the lifetime of the card.\n"
                    enum:
                    - CARD_CREATED
                    - CARD_ISSUED
                    - CARD_ACTIVATED
                    - CARD_LOCKED
                    - CARD_UNLOCKED
                    - CARD_TERMINATED
                    - CARD_EXPIRED
                    - CARD_LIMIT_CHANGED
                    - CARD_LIMIT_CHANGE_FAILED
                    - CARD_DETAILS_CHANGED
                    - CARD_BALANCE_UPDATED
                    - CARD_AVAILABLE_BALANCE_CHANGED
                    - CARD_STATUS_CHANGED
                    - CARD_VALIDITY_UPDATED
                    - CARD_SHIPPED
                    - CARD_CLICK_TO_PAY_INFO_CHANGED
                    - CARD_BENEFIT_LOADED
                    - CARD_BENEFIT_UNLOADED
                    - CARD_LIMITS_CHANGED
                    - CARD_ACCESS_LINK_REQUESTED
                    - CARD_REASSIGNED
              required:
              - callbackUrl
              - eventTypes
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      callbacks:
        cardUpdated:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                description: 'This callback object is used for the following event types: `CARD_CREATED`, `CARD_ISSUED`, `CARD_ACTIVATED`, `CARD_LOCKED`, `CARD_UNLOCKED`, `CARD_TERMINATED`, `CARD_LIMIT_CHANGED`, `CARD_DETAILS_CHANGED`, `CARD_SHIPPED`.'
                content:
                  application/json:
                    schema:
                      allOf:
                      - type: object
                        properties:
                          eventType:
                            type: string
                            description: The type of event.
                      - properties:
                          cardId:
                            type: string
                            format: uuid
                          organizationId:
                            type: string
                            format: uuid
                          cardholderId:
                            type: string
                            format: uuid
                          cardAccountId:
                            type: string
                            format: uuid
                            description: The unique identifier of the [card account](/docs/card-account).
                          type:
                            type:
                            - string
                            - 'null'
                            deprecated: true
                            description: 'Deprecated, please use `cardConfig` instead.

                              `BLACK` - Physical black premium credit card

                              `PHYSICAL` - Physical credit card

                              `VIRTUAL` - Virtual credit card

                              `SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)

                              `TRAVEL` - Virtual cards used specifically in travel industry related use cases

                              '
                            enum:
                            - BLACK
                            - PHYSICAL
                            - VIRTUAL
                            - SINGLE_USE
                            - TRAVEL
                          cardConfig:
                            type: string
                            description: Please contact your Pliant contact person for details
                          cardDesignId:
                            type:
                            - string
                            - 'null'
                            format: uuid
                            description: The unique identifier of the card design used for this card. Present only for virtual cards.
                          status:
                            type: string
                            description: 'The status of the card.


                              **Deprecation Notice:** The status values `PENDING_ACTIVATION`, `PENDING_ISSUANCE`, and `PENDING_REGISTRATION` are deprecated and will be mapped to `PENDING` with appropriate `pendingDetails` in the future. Use `PENDING` with the corresponding `pendingDetails` value instead.

                              '
                            enum:
                            - PENDING
                            - PENDING_ACTIVATION
                            - PENDING_ISSUANCE
                            - PENDING_REGISTRATION
                            - REQUEST_APPROVED
                            - REQUESTED
                            - REQUEST_CANCELLED
                            - REQUEST_REJECTED
                            - ACTIVE
                            - LOCKED
                            - LOCKED_PIN
                            - EXPIRED
                            - TERMINATED
                            - TERMINATED_LOST
                            - TERMINATED_STOLEN
                            x-enumDescriptions:
                              PENDING: Card is in a pending state. Check `pendingDetails` for the specific reason.
                              PENDING_ACTIVATION: '~~(Deprecated) Use `PENDING` with `pendingDetails: PENDING_ACTIVATION` instead.~~'
                              PENDING_ISSUANCE: '~~(Deprecated) Use `PENDING` with `pendingDetails: PENDING_ISSUANCE` instead.~~'
                              PENDING_REGISTRATION: '~~(Deprecated) Use `PENDING` with `pendingDetails: PENDING_REGISTRATION` instead.~~'
                              REQUEST_APPROVED: Card request has been approved.
                              REQUESTED: Card has been requested.
                              REQUEST_CANCELLED: Card request has been cancelled.
                              REQUEST_REJECTED: Card request has been rejected.
                              ACTIVE: Card is active and can be used.
                              LOCKED: Card is locked.
                              LOCKED_PIN: Card is locked due to PIN issues.
                              EXPIRED: Card has expired.
                              TERMINATED: Card has been terminated.
                              TERMINATED_LOST: Card has been terminated because it was lost.
                              TERMINATED_STOLEN: Card has been terminated because it was stolen.
                          pendingDetails:
                            type:
                            - string
                            - 'null'
                            description: 'The internal reason for a card''s pending state. This field is only populated when `status` is `PENDING` or one of the deprecated `PENDING_...` statuses, and will be `null` for all non-pending statuses.

                              '
                            enum:
                            - PENDING_ACTIVATION
                            - PENDING_ISSUANCE
                            - PENDING_REGISTRATION
                            - PENDING_VALIDITY
                            - PENDING_SANCTION_SCREEN
                            - PENDING_INFORMATION
                            x-enumDescriptions:
                              PENDING_ACTIVATION: Card is pending activation.
                              PENDING_ISSUANCE: Card is pending issuance.
                              PENDING_REGISTRATION: Card is pending registration.
                              PENDING_VALIDITY: Card is pending validity period.
                              PENDING_SANCTION_SCREEN: Card is pending sanction screening.
                              PENDING_INFORMATION: Card is pending additional information.
                          label:
                            type:
                            - string
                            - 'null'
                            description: Available only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`. The maximum length is 40 characters.
                            maxLength: 40
                          purpose:
                            type:
                            - string
                            - 'null'
                            description: Available only for virtual cards with type `SINGLE_USE`
                          limitChange:
                            type:
                            - object
                            - 'null'
                            description: Filled only for events of type CARD_LIMIT_CHANGED
                            properties:
                              beforeChange:
                                type:
                                - object
                                - 'null'
                                properties:
                                  limit:
                                    type: object
                                    properties:
                                      value:
                                        type: number
                                      currency:
                                        type: string
                                  limitRenewFrequency:
                                    type: string
                                    enum:
                                    - DAILY
                                    - WEEKLY
                                    - MONTHLY
                                    - QUARTERLY
                                    - ANNUAL
                                    - TOTAL
                                    description: '* `DAILY` - The card limit is renewed every day

                                      * `WEEKLY` - The card limit is renewed every week

                                      * `MONTHLY` - The card limit is renewed every calendar month

                                      * `QUARTERLY` - The card limit is renewed every calendar quarter

                                      * `ANNUAL` - The card limit is renewed every year

                                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                                      '
                                  transactionLimit:
                                    type: object
                                    properties:
                                      value:
                                        type: number
                                      currency:
                                        type: string
                              afterChange:
                                type:
                                - object
                                - 'null'
                                properties:
                                  limit:
                                    type: object
                                    properties:
                                      value:
                                        type: number
                                      currency:
                                        type: string
                                  limitRenewFrequency:
                                    type: string
                                    enum:
