                  minLength: 0
                  maxLength: 40
                purpose:
                  type: string
                  description: Available only for virtual cards with type `SINGLE-USE`. The maximum length is 40 characters.
                  minLength: 0
                  maxLength: 40
      responses:
        '204':
          description: Ok
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
