openapi: 3.2.0
info:
  contact:
    name: API Support
    email: support@getpliant.com
    url: https://www.getpliant.com
  title: Pliant Customer Cards API
  description: Pliant Customer API
  version: 2.1.0
  license:
    name: MIT
    url: https://opensource.org/license/MIT
servers:
- url: https://partner-api.getpliant.com/api
  description: Pliant Production Server
- url: https://sandbox.partner-api.getpliant.com/api
  description: Pliant Sandbox Server
- url: https://pci-api.getpliant.com
  description: PCI Vault Production Server
- url: https://pci-sandbox.partner-api.getpliant.com
  description: PCI Vault Sandbox Server
security:
- bearerAuth: []
tags:
- name: Cards
  description: This tag is for operations related to cards
paths:
  /cards:
    get:
      summary: List Cards
      description: 'Returns a list of cards. You can use the `limit`, `page`, `sortBy` and `sortDirection` parameters to filter and sort the results.


        **This endpoint has changed in comparison to the previous version of the API.** The following changes were made:

        - changed the enumeration for the status field in the response body'
      tags:
      - Cards
      operationId: get-cards
      parameters:
      - name: organizationId
        in: query
        description: The ID of the organization to filter by.
        schema:
          type: string
          format: uuid
        required: true
      - name: cardAccountId
        in: query
        description: The ID of the card account to filter by. A card always carries the card account it is currently assigned to. Once a card has been reassigned (see the `CARD_REASSIGNED` callback), it is only returned for its new card account, not for the superseded one.
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: A list of statuses of cards to filter by.
        schema:
          type: array
          items:
            type: string
            enum:
            - PENDING
            - PENDING_ACTIVATION
            - PENDING_ISSUANCE
            - PENDING_REGISTRATION
            - REQUEST_APPROVED
            - REQUESTED
            - REQUEST_CANCELLED
            - REQUEST_REJECTED
            - ACTIVE
            - LOCKED
            - LOCKED_PIN
            - EXPIRED
            - TERMINATED
            - TERMINATED_LOST
            - TERMINATED_STOLEN
      - name: cardholderId
        in: query
        description: The ID of the [cardholder](/docs/cardholder-entity) to filter by.
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        deprecated: true
        description: '**DEPRECATED**: Use `cardConfig` parameter instead. A list of types of cards to filter by.'
        schema:
          type: array
          items:
            type: string
            enum:
            - VIRTUAL
            - SINGLE_USE
            - TRAVEL
            - PHYSICAL
            - BLACK
      - name: cardConfig
        in: query
        description: Filter by exact card configuration (e.g., PLIANT_PHYSICAL, PLIANT_VIRTUAL_TRAVEL, PLIANT_SINGLE_USE). Can be specified multiple times for filtering by multiple configurations.
        schema:
          type: array
          items:
            type: string
      - name: fromDate
        in: query
        description: The `from` date to filter by as zero-offset UTC time. The date boundary is inclusive. Meaning we compare with `>=`.
        schema:
          type: string
          format: date-time
          example: '2024-07-19T15:00:00.000000Z'
      - name: toDate
        in: query
        description: The `to` date to filter by as zero-offset UTC time. The date boundary is inclusive. Meaning we compare with `<=`.
        schema:
          type: string
          format: date-time
          example: '2024-07-19T15:00:00.000000Z'
      - name: byDateField
        in: query
        description: The date field to filter by if `fromDate` and `toDate` are present.
        schema:
          type:
          - string
          - 'null'
          enum:
          - createdAt
          - updatedAt
          default: createdAt
      - name: limit
        in: query
        description: The maximum number of items to return per page. The default value if not provided is 100, the maximum allowed value is 1000.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The field to sort by.
        schema:
          type: string
          enum:
          - organizationId
          - status
          - cardholderId
          - updatedAt
      - name: sortDirection
        in: query
        description: The direction to sort by.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        cardId:
                          type: string
                          format: uuid
                          description: The unique identifier of the card.
                        organizationId:
                          type: string
                          format: uuid
                          description: The unique identifier of the organization.
                        cardAccountId:
                          type: string
                          format: uuid
                          description: The unique identifier of the card account.
                        cardholderId:
                          type: string
                          format: uuid
                          description: The unique identifier of the cardholder.
                        type:
                          type:
                          - string
                          - 'null'
                          deprecated: true
                          description: 'Deprecated, please use `cardConfig` instead.

                            `VIRTUAL` - Virtual credit card

                            `SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)

                            `PHYSICAL` - Physical credit card

                            `BLACK` - Physical black premium credit card

                            `TRAVEL` - Virtual cards used specifically in travel industry related use cases

                            '
                          enum:
                          - VIRTUAL
                          - SINGLE_USE
                          - PHYSICAL
                          - BLACK
                          - TRAVEL
                        cardConfig:
                          type: string
                          description: The Pliant card configuration of this card. This describes all feature of this card in one single configuration, e.g. the type of the card and also the design of the card etc. It replaces the deprecated card `type`. Please refer to the [guide section](/docs/card-entity) to learn more about possible values.
                        platformFee:
                          type: boolean
                          description: Whether the card is used for the internal Pliant platform fee or not.
                        cardDesignId:
                          type: string
                          format: uuid
                          description: The unique identifier of the card design used for this specific card.
                        cardDesignLogoName:
                          type:
                          - string
                          - 'null'
                          description: The name of the card design used for this specific card.
                        createdAt:
                          type: string
                          format: date-time
                          description: The date-time when card was created.
                        updatedAt:
                          type: string
                          format: date-time
                          description: The date-time when card was updated.
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          description: Bad Request. The API consumer sent a malformed request which could not be processed.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1card-accounts~1{cardAccountId}~1deactivate/post/responses/400/content/application~1json/schema'
        '401':
          description: Unauthorized. The API consumer is not authorized to access the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1card-accounts~1{cardAccountId}~1deactivate/post/responses/400/content/application~1json/schema'
        '403':
          description: Forbidden. The API consumer is not allowed to access the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1card-accounts~1{cardAccountId}~1deactivate/post/responses/400/content/application~1json/schema'
        '429':
          description: Too Many Requests. The API consumer has sent too many requests in a given amount of time. Please check our [API guidelines](/docs/pliant-api-guidelines#api-rate-limits).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Detailed description of the error and breached rate limit.
        '500':
          description: Internal Server Error. The request was not completed due to an internal error.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1card-accounts~1{cardAccountId}~1deactivate/post/responses/400/content/application~1json/schema'
    post:
      summary: Issue Card with Cardholder
      description: 'Issue a new credit card for an existing or a new cardholder. A detailed explanation of different types and statuses can be found in our guides section. Hint: you can also replace an existing card instead.

        If the cardholder is in the invited state at the time of issuing the card, we will park the card issuing request and automatically issue the card once the cardholder is active.

        Please be aware that card issuing is (as many other processes in Pliant''s API) an asynchronous process. This means you need to rely on the callback for the card being active, before you can start using it.'
      tags:
      - Cards
      operationId: issue-card-with-cardholder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - organizationId
                - limit
                - transactionLimit
                - cardConfig
                properties:
                  cardholderId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The id of the [cardholder](/docs/cardholder-entity) to issue the card for. This cardholder needs to have a phone number, otherwise 3DS security mechanism during a purchase will not work. If not provided, you must provide a `cardholder` object to create a new cardholder as part of the card issuing process.
                  organizationId:
                    type: string
                    format: uuid
                    description: The ID of the organization to issue the card for.
                  cardAccountId:
                    type: string
                    format: uuid
                    description: The ID of the [card account](/docs/card-account) to issue the card for. If not provided, the card will be issued for the default [card account](/docs/card-account) of the organization. If the given card account has `status` `SUPERSEDED`, the request is transparently resolved to its successor (`supersededBy`) and the response carries the id of that successor card account.
                  cardConfig:
                    type: string
                    description: 'The Pliant card configuration of this card.

                      This describes all features of this card in one single configuration, e.g. the type of the card and also the design of the card etc.

                      Please refer to the [guide section](/docs/card-entity) to learn more about possible values.

                      '
                  cardDesignId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: 'The unique identifier of the card design used for this card.

                      This field can only be set when creating virtual cards.

                      Available designs for a card config can be retrieved via the [available cards endpoint](/reference/get-available-cards).

                      '
                  label:
                    type:
                    - string
                    - 'null'
                    description: Mandatory only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`, the maximum length is 40 characters.
                    maxLength: 40
                  purpose:
                    type: string
                    description: Mandatory only for virtual cards with `cardConfig` ending with `SINGLE_USE`
                    maxLength: 200
                  validityPeriod:
                    type: number
                    description: "Number of months when card expires.\n- Mandatory for `cardConfig` containing `VIRTUAL` and `TRAVEL`\n- For `cardConfig` ending with `PHYSICAL` or `BLACK`: set to 36 months automatically\n- For `cardConfig` ending with `SINGLE_USE`: set to 12 months automatically\n- For `cardConfig` containing `INSURANCE`:\n  - Physical insurance: set to 24 months automatically\n  - Virtual insurance (excluding single-use): validated from enum, defaults to 36 months\n  - Single-use insurance: set to 12 months automatically\nFor cards with fixed validity periods, user input is ignored.\n"
                    enum:
                    - 3
                    - 6
                    - 9
                    - 12
                    - 18
                    - 24
                    - 30
                    - 36
                  validFrom:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases, replaces the `validityPeriod` if used. Outside of this date range, the card cannot be used for any purchases, only for zero-amount card-checks, and is shown with `status` `PENDING`. If not provided, the card is active immediately. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the provided date is already a valid day to use the card. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The earliest possible date is the current date. The `validFrom` date needs to be before the `validTo` date. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all. This field can be [updated later](/reference/update-card-validity-period). This field must be `null` when issuing benefit cards.
                  validTo:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases, replaces the `validityPeriod` if used. After the specified date, the card is automatically terminated. If not provided, the card is active until the `validityPeriod` ends. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the card will be terminated one day after this date. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The earliest possible date is the current date. The latest possible date is the end date of the `validityPeriod`. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all. This field can be [updated later](/reference/update-card-validity-period). This field must be `null` when issuing benefit cards.
                  validTimezone:
                    type: string
                    description: Optional field to describe the timezone for the `validFrom` and `validTo` fields. This field is mandatory if `validFrom` and `validTo` fields are used. A list of valid timezones can be found in our [guide section](/docs/card-controls-1). This field can be [updated later](/reference/update-card-validity-period). This field must be `null` when issuing benefit cards.
                    example: Europe/Berlin
                  maxTransactionCount:
                    type: number
                    minimum: 1
                    maximum: 999999999
                    description: ':exclamation: IMPORTANT: if the `cardConfig` is `TRAVEL` and this field is not set, the **default value will be `5`**.

                      Optional field to describe the maximum number of transactions within the range of `1..999999999` that can be performed with this card.

                      If not provided, the card can be used for an unlimited number of transactions until the card expires.

                      '
                  limit:
                    type: object
                    description: The limit of the card. The limit renews according to the `limitRenewFrequency` or never, if `limitRenewFrequency` is set to `TOTAL`. This limit can later be adjusted via the [update limit endpoint](/reference/update-card-limit). The limit can be up to the organization's overall limit. For instance an organization with a limit of 1,000,000 EUR can have a card with a limit up to 1,000,000 EUR. It is also possible to have more than one card with the maximum limit. For example you can have two cards each with a limit of 1,000,000 EUR. The card limits are not added up on creation, only the transactions happening on the card are added up and checked against the organization's overall limit. The limit must be `0` (of the card's currency) when issuing benefit cards.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro. This has to match the currency of the respective [card account](/docs/card-account)!
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: 'The frequency of the card limit renewal.

                      * `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month, this is the default setting.

                      * `QUARTERLY` - The card limit is renewed every calendar quarter.

                      * `ANNUAL` - The card limit is renewed every year.

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                  transactionLimit:
                    type: object
                    description: The transaction limit of the card. Meaning the maximum amount of a single transaction. This is always below or equal to the `limit` of the card. This limit can later be adjusted via the [update limit endpoint](/reference/update-card-limit). The transaction limit can be up to the card's limit. For instance a card with a limit of 1,000 EUR can have a transaction limit up to 1,000 EUR. The transaction limit must be `0` (of the card's currency) when issuing benefit cards.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro. This has to match the currency of the respective [card account](/docs/card-account)!
                  customFirstName:
                    type:
                    - string
                    - 'null'
                    description: 'Optional first name on `TRAVEL` cards which will be used on the card. When used, this replaces the [cardholder](/docs/cardholder-entity) first name, which normally is used on the card. The maximum length of `customFirstName` is 50 characters. If used, both fields (`customFirstName` and `customLastName`) have to be provided with at least one character each. It is important to note, that only the following characters are allowed for issuing cards: `A-Z`, `a-z`, `0-9`, `äöüÄÖÜ.-`'
                    maxLength: 50
                  customLastName:
                    type:
                    - string
                    - 'null'
                    description: 'Optional last name on `TRAVEL` cards which will be used on the card. When used, this replaces the [cardholder](/docs/cardholder-entity) last name, which normally is used on the card. The maximum length of `customLastName` is 50 characters. If used, both fields (`customFirstName` and `customLastName`) have to be provided with at least one character each. It is important to note, that only the following characters are allowed for issuing cards: `A-Z`, `a-z`, `0-9`, `äöüÄÖÜ.-`'
                    maxLength: 50
                  cardControls:
                    type:
                    - object
                    - 'null'
                    description: Optionally, the card controls which will be applied to this card.
                    $ref: '#/paths/~1cards~1{cardId}~1card-controls/put/requestBody/content/application~1json/schema/allOf/0'
                  customFields:
                    type:
                    - array
                    - 'null'
                    description: 'Optional custom fields which can be set on a card. A custom field may have a default value which will be copied to every transaction made with this card. You can identify a custom field either by its `id` or its `label`. If both are provided, the `id` will be used. You can also create new custom fields (of type `TEXT`) on-the-fly by providing a newly, unused label and the corresponding default value you want to set. So mainly two uses cases exist: 1. Use an existing custom field on the card, mostly identified via its `id`. 2. Create a new custom field (of type `TEXT`) on-the-fly via the `label` and set it on the card.'
                    items:
                      type: object
                      required:
                      - defaultValue
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the custom field, to identify an existing custom field which should be set on this card. Either `id` or `label` has to be provided. If both are provided, the `id` will be used.
                        label:
                          type: string
                          description: The label of the custom field, to identify which custom field should be set on this card. Or, to create a new custom field on-the-fly, if the label is currently unused. Either `id` or `label` has to be provided. If both are provided, the `id` will be used.
                        defaultValue:
                          type: string
                          description: The default value of the custom field to set on this card. This default value will be copied to every transaction made with this card. This is not the default value of the custom field itself, but the default value of the custom field on this card! The maximum length of the default value is 64kB.
                          maxLength: 65536
                  teamId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The ID of the team to issue the card for.
                  projectId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The ID of the project to issue the card for.
                  copilots:
                    type:
                    - object
                    - 'null'
                    description: Optional feature for `TRAVEL` cards. This feature allows to assign cardholders or teams as copilots to the card. The copilot also has access to the card and its card details alongside with the cardholder of the card itself.
                    properties:
                      cardholderIds:
                        type:
                        - array
                        - 'null'
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the cardholders to assign as copilot to the card.
                      teamIds:
                        type:
                        - array
                        - 'null'
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the teams to assign as copilot to the card.
                  deliverTo:
                    type:
                    - string
                    - 'null'
                    enum:
                    - ORGANIZATION
                    - CARDHOLDER
                    description: 'Optionally, specifies where the physical card should be delivered.

                      * `ORGANIZATION` - Ship to organization address (default)

                      * `CARDHOLDER` - Ship to cardholder''s personal delivery address


                      This field is only applicable for physical cards.

                      If not provided, the card will be shipped to the organization address.



                      The request will fail if the cardholder''s personal delivery address is not set and `deliverTo` is set to `CARDHOLDER`.

                      '
                  cardholder:
                    type:
                    - object
                    - 'null'
                    description: Optional description of a new [cardholder](/docs/cardholder-entity) to be created alongside the card. If `cardholderId` is not provided, this field is required.
                    required:
                    - firstName
                    - lastName
                    - email
                    - language
                    properties:
                      membershipType:
                        type:
                        - string
                        - 'null'
                        description: 'Defines how the cardholder is onboarded and accesses their cards.

                          `STANDARD` - Cardholders receive an invitation email to register, set up a password and MFA, and become registered members with access to the Pliant web app according to their assigned role.

                          `LIMITED` - For distributing cards via access links without requiring registration. This is also intended for direct customers sharing cards with recipients outside their organization. Cardholders do not receive a registration invitation and cannot access the Pliant web app. Instead, they access their cards through access links shared with them, with access limited to card-related functionality. The `GUEST` role is assigned automatically and does not need to be provided.

                          `EMBEDDED` - Reserved for partners embedding the cardholder experience in their own application. No invitation email is sent. The partner is responsible for obtaining acceptance of the terms and conditions and verifying the cardholder''s phone number.

                          If not provided, `STANDARD` is applied. `LIMITED` and `EMBEDDED` always have to be requested explicitly.'
                        enum:
                        - STANDARD
                        - LIMITED
                        - EMBEDDED
                      salutation:
                        type: string
                        enum:
                        - MR
                        - MRS
                        description: The Salutation used for email communication.
                      email:
                        type: string
                        maxLength: 50
                        description: The email address of the cardholder. This will be used for email communication. If a cardholder with this email address already exists, all the information from the existing cardholder will be used, the cardholder information sent in this request will be ignored.
                      firstName:
                        type: string
                        description: 'The first name of the cardholder. This will be printed on credit cards as the cardholder. It is important to note, that only the following characters are allowed for issuing cards: `A-Z`, `a-z`, `0-9`, `äöüÄÖÜ.-` The combined length of first name and last name must not exceed 24 characters. One additional character is reserved for the space inserted between them when displayed on the card (25 characters in total).'
                      lastName:
                        type: string
                        description: 'The last name of the cardholder. This will be printed on credit cards as the cardholder. It is important to note, that only the following characters are allowed for issuing cards: `A-Z`, `a-z`, `0-9`, `äöüÄÖÜ.-` The combined length of first name and last name must not exceed 24 characters. One additional character is reserved for the space inserted between them when displayed on the card (25 characters in total).'
                      language:
                        type: string
                        enum:
                        - en
                        - de
                        - es
                        - fi
                        - fr
                        - it
                        - pt
                        - nl
                        - et
                        - el
                        - lv
                        - lt
                        - sk
                        - sl
                        - pl
                        - hu
                        description: Used for setting the language in Pliant apps as well as for email communication.
                      dateOfBirth:
                        type:
                        - string
                        - 'null'
                        format: date
                        description: The date-of-birth of the cardholder.
                      nationality:
                        type:
                        - string
                        - 'null'
                        description: The nationality of the cardholder (ISO 3166-1 alpha-2).
                      roles:
                        type: array
                        items:
                          type: string
                          enum:
                          - ACCOUNT_OWNER,
                          - ORG_ADMIN,
                          - ACCOUNTANT,
                          - CARDHOLDER,
                          - LEGAL_REP
                          - GUEST
                        description: 'Roles of the cardholder to be created. Usually, the regular cardholder uses the `CARDHOLDER` role, granting them full access to the Pliant platform. Alternatively the `GUEST` role can be provided to give the cardholder limited access to Pliant apps.

                          Required for `STANDARD` memberships. For `LIMITED` the `GUEST` role is assigned automatically and cannot be combined with any other role, so you do not need to provide this property. For `EMBEDDED` roles do not apply and `CARDHOLDER` is used when none is provided.'
                      phoneNumber:
                        type:
                        - string
                        - 'null'
                        maxLength: 16
                        pattern: ^\+[0-9]{8,15}$
                        description: Phone number of the cardholder. If provided, must start with `+` followed by 8 to 15 numbers, e.g. `+49123456789`.
                      personalAddress:
                        type:
                        - object
                        - 'null'
                        description: The personal address of the cardholder.
                        properties:
                          country:
                            type:
                            - string
                            - 'null'
                            maxLength: 2
                            description: The country of the address in ISO 3166-1 alpha-2 notation.
                          state:
                            type:
                            - string
                            - 'null'
                            minLength: 2
                            maxLength: 2
                            pattern: ^[A-Z]{2}$
                            description: The US state (e.g. `CA`, `NY`). Only applicable when `country` is `US`.
                          city:
                            type:
                            - string
                            - 'null'
                            maxLength: 50
                            description: The city of the address.
                          postalCode:
                            type:
                            - string
                            - 'null'
                            maxLength: 10
                            description: The postal code of the address. Must match the country-specific format (e.g. 5 digits for `DE`/`FR`/`ES`, 4 digits for `AT`/`BE`). Both `postalCode` and `country` must be provided together.
                          streetName:
                            type:
                            - string
                            - 'null'
                            maxLength: 50
                            description: The street name of the address.
                          streetNumber:
                            type:
                            - string
                            - 'null'
                            maxLength: 50
                            description: The street number of the address.
                          additionalInformation:
                            type:
                            - string
                            - 'null'
                            maxLength: 50
                            description: Optional additional address information.
                      deliveryAddress:
                        type:
                        - object
                        - 'null'
                        description: The delivery address of the cardholder.
                        properties:
                          country:
                            type:
                            - string
                            - 'null'
                            maxLength: 2
                            description: The country of the address in ISO 3166-1 alpha-2 notation.
                          state:
                            type:
                            - string
                            - 'null'
                            minLength: 2
                            maxLength: 2
                            pattern: ^[A-Z]{2}$
                            description: The US state (e.g. `CA`, `NY`). Only applicable when `country` is `US`.
                          city:
                            type:
                            - string
                            - 'null'
                            maxLength: 50
                            description: The city of the address.
                          postalCode:
                            type:
                            - string
                            - 'null'
                            maxLength: 10
                            description: The postal code of the address. Must match the country-specific format (e.g. 5 digits for `DE`/`FR`/`ES`, 4 digits for `AT`/`BE`). Both `postalCode` and `country` must be provided together.
                          streetName:
                            type:
                            - string
                            - 'null'
                            maxLength: 50
                            description: The street name of the address.
                          streetNumber:
                            type:
                            - string
                            - 'null'
                            maxLength: 50
                            description: The street number of the address.
                          additionalInformation:
                            type:
                            - string
                            - 'null'
                            maxLength: 50
                            description: Optional additional address information.
      responses:
        '200':
          description: Ok. The card can be used after you received the callback for the card being active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardId:
                    type: string
                    format: uuid
                    description: The Pliant card id (UUIDv4) of the card.
                  type:
                    type:
                    - string
                    - 'null'
                    deprecated: true
                    enum:
                    - VIRTUAL
                    - SINGLE_USE
                    - PHYSICAL
                    - BLACK
                    - TRAVEL
                    description: 'Deprecated, please use `cardConfig` instead.

                      `VIRTUAL` - Virtual credit card

                      `SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)

                      `PHYSICAL` - Physical credit card

                      `BLACK` - Physical black premium credit card

                      `TRAVEL` - Virtual cards used specifically in travel industry related use cases

                      Either `type` or `cardConfig` has to be provided. Please prefer `cardConfig`.

                      '
                  cardConfig:
                    type: string
                    description: The Pliant card configuration of this card. This describes all feature of this card in one single configuration, e.g. the type of the card and also the design of the card etc. It replaces the deprecated card `type`. Please refer to the [guide section](/docs/card-entity) to learn more about possible values. Either `type` or `cardConfig` has to be provided. Please prefer `cardConfig`.
                  cardDesignId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The unique identifier of the card design used for this card. Present only for virtual cards.
                  cardholderId:
                    type: string
                    format: uuid
                    description: The ID of the [cardholder](/docs/cardholder-entity) this card is issued for.
                  organizationId:
                    type: string
                    format: uuid
                    description: The ID of the organization this card is issued for.
                  cardAccountId:
                    type: string
                    format: uuid
                    description: The ID of the [card account](/docs/card-account) this card is issued for.
                  transactionLimit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  monthlyLimit:
                    type: object
                    deprecated: true
                    description: Use `limit` instead
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: '* `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month

                      * `QUARTERLY` - The card limit is renewed every calendar quarter

                      * `ANNUAL` - The card limit is renewed every year

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                  expiryDate:
                    type: string
                    format: date-time
                  label:
                    type:
                    - string
                    - 'null'
                    description: Available only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`. The maximum length is 40 characters.
                    maxLength: 40
                  purpose:
                    type:
                    - string
                    - 'null'
                    description: Available only for cards with type `SINGLE_USE`
                  customFirstName:
                    type:
                    - string
                    - 'null'
                    description: Optional first name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                  customLastName:
                    type:
                    - string
                    - 'null'
                    description: Optional last name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                  cardControls:
                    type:
                    - object
                    - 'null'
                    $ref: '#/paths/~1cards~1{cardId}~1card-controls/put/requestBody/content/application~1json/schema/allOf/0'
                  validFrom:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases. Outside of this date range, the card cannot be used for any purchases, only for zero-amount card-checks, and is shown with `status` `PENDING`. If not provided, the card is active immediately. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the provided date is already a valid day to use the card. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The earliest possible date is the current date. The `validFrom` date needs to be before the `validTo` date. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                    example: '2023-12-01'
                  validTo:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases. After the specified date, the card is automatically terminated. If not provided, the card is active until the `validityPeriod` ends. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the card will be terminated one day after this date. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The latest possible date is the end date of the `validityPeriod`. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                    example: '2023-12-31'
                  validTimezone:
                    type: string
                    description: Optional field to describe the timezone for the `validFrom` and `validTo` fields. This field is mandatory if `validFrom` and `validTo` fields are used. A list of valid timezones can be found in our [guide section](/docs/card-controls-1).
                  maxTransactionCount:
                    type: number
                    minimum: 1
                    maximum: 999999999
                    description: Optional field to describe the maximum number of transactions within the range of `1..999999999` that can be performed with this card. If not provided, the card can be used for an unlimited number of transactions until the card expires.
                  clickToPayInfo:
                    type:
                    - object
                    - 'null'
                    description: 'Click to Pay enrollment information for this card. Only present for Visa cards that support Click to Pay.

                      This object may be `null` if Click to Pay is not supported generally (e.g., per country), but normally it will be present with a `status` of `NOT_SUPPORTED` if the card type doesn''t support Click to Pay (e.g., Mastercard or Travel Purchasing Cards).

                      '
                    properties:
                      status:
                        type: string
                        description: 'The Click to Pay enrollment status of the card.

                          * `NOT_SUPPORTED` - Card type doesn''t support Click to Pay (e.g., Mastercard or Travel Purchasing Cards)

                          * `NOT_ENROLLED` - Card is eligible but not enrolled in Click to Pay

                          * `PENDING` - Card enrollment is awaiting the cardholder''s Click to Pay member enrollment to complete

                          * `ENROLLED` - Card is currently enrolled in Click to Pay

                          '
                        enum:
                        - NOT_SUPPORTED
                        - NOT_ENROLLED
                        - PENDING
                        - ENROLLED
                        x-enumDescriptions:
                          NOT_SUPPORTED: Card type doesn't support Click to Pay (e.g., Mastercard or Travel Purchasing Cards).
                          NOT_ENROLLED: Card is eligible but not enrolled in Click to Pay.
                          PENDING: Card enrollment is awaiting the cardholder's Click to Pay member enrollment to complete. Once the member is enrolled, the card enrollment is triggered automatically.
                          ENROLLED: Card is currently enrolled in Click to Pay.
                      enrolledAt:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Date-time when the card was enrolled in Click to Pay. `null` if the card has never been enrolled.
                      unenrolledAt:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Date-time when the card was unenrolled from Click to Pay. `null` if the card has never been unenrolled.
                  customFields:
                    type: array
                    description: The [custom fields](/docs/custom-fields-on-transactions) set on this card. These [custom fields](/docs/custom-fields-on-transactions) are used as default values for every transaction made with this card. If no [custom fields](/docs/custom-fields-on-transactions) are assigned to the card, we return an empty list.
                    items:
                      type: object
                      $ref: '#/paths/~1cards~1{cardId}~1custom-fields/patch/responses/202/content/application~1json/schema/items'
                  copilots:
                    type:
                    - object
                    - 'null'
                    description: Optional feature for `TRAVEL` cards. The copilot also has access to the card and its card details alongside with the cardholder of the card itself.
                    properties:
                      cardholderIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the cardholders assigned as copilots to the card.
                      teamIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the teams assigned as copilots to the card.
                  additionalLimits:
                    type: array
                    description: Additional limits set on the card. Empty when none were configured at creation.
                    items:
                      type: object
                      description: An additional limit applied to this card.
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The unique identifier of this additional limit. Use this `id` when updating or removing the limit via `PUT /api/cards/limits/{cardId}`.
                        limitRenewFrequency:
                          type: string
                          enum:
                          - PER_TRANSACTION
                          - DAILY
                          - WEEKLY
                          - MONTHLY
                          - QUARTERLY
                          - ANNUAL
                          - TOTAL
                          description: 'The renewal frequency of this additional limit. `PER_TRANSACTION` is only valid for additional limits, not for the card''s primary limit.

                            * `PER_TRANSACTION` - Limit applies to each individual transaction.

                            * `DAILY` - The limit is renewed every day.

                            * `WEEKLY` - The limit is renewed every week.

                            * `MONTHLY` - The limit is renewed every calendar month.

                            * `QUARTERLY` - The limit is renewed every calendar quarter.

                            * `ANNUAL` - The limit is renewed every year.

                            * `TOTAL` - The limit is never renewed. Once spent, no further transactions are allowed under this limit.

                            '
                        limit:
                          type: object
                          description: The monetary cap for this additional limit.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        maxTransactionCount:
                          type:
                          - number
                          - 'null'
                          minimum: 1
                          maximum: 999999999
                          description: Maximum number of transactions allowed under this additional limit within its renewal period. Null if no transaction-count cap is configured.
                        scope:
                          type:
                          - object
                          - 'null'
                          description: The scope restriction of this additional limit. Null when no scope is defined (`categories` and `acceptanceMethods` empty, `atmWithdrawal` false, `currency` null).
                          properties:
                            categories:
                              type: array
                              description: Merchant category types this limit applies to. Empty when no category restriction is set.
                              items:
                                type: string
                                enum:
                                - ADVERTISING_AND_MARKETING
                                - COMPUTING_AND_SOFTWARE
                                - EDUCATION_AND_TRAINING
                                - ELECTRONICS_AND_IT_EQUIPMENT
                                - ENTERTAINMENT_AND_WELLNESS
                                - FOOD_AND_DRINKS
                                - GIFTS_AND_VOUCHERS
                                - HEALTHCARE
                                - MATERIALS_AND_PACKAGING
                                - OFFICE_SUPPLIES_AND_EQUIPMENT
                                - SERVICES
                                - TRAVEL_AND_ACCOMMODATION
                                - OTHER
                            acceptanceMethods:
                              type: array
                              description: The card acceptance methods this limit applies to. Empty when no acceptance-method restriction is set.
                              items:
                                type: string
                                enum:
                                - ONLINE
                                - MOBILE_WALLET
                                - MANUAL_ENTRY
                                - CONTACTLESS
                                - CHIP_DIP
                                - NOT_AVAILABLE
                                - MAGNETIC_STRIPE
                                - OTHER
                            atmWithdrawal:
                              type: boolean
                              description: When `true`, this additional limit applies to ATM withdrawal transactions.
                            currency:
                              type:
                              - string
                              - 'null'
                              description: ISO 4217 currency code this limit is scoped to, e.g. `PLN`. Null when no currency scope is defined.
                        balanceInfo:
                          type:
                          - object
                          - 'null'
                          description: Spending balance information for this additional limit. Null when no balance record exists.
                          properties:
                            balance:
                              type: object
                              description: Amount spent under this additional limit in the current renewal period.
                              properties:
                                value:
                                  type: number
                                  description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                                currency:
                                  type: string
                                  description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                            availableLimit:
                              type: object
                              description: Remaining amount available under this additional limit in the current renewal period.
                              properties:
                                value:
                                  type: number
                                  description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                                currency:
                                  type: string
                                  description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                            limitRenewDate:
                              type:
                              - string
                              - 'null'
                              format: date
                              description: Date when this additional limit's balance will next be renewed, e.g. `2026-06-01`. Null for `TOTAL` frequency limits.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          description: Not Found. The requested resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1card-accounts~1{cardAccountId}~1deactivate/post/responses/400/content/application~1json/schema'
        '422':
          description: Unprocessable Content. The request could not be completed due to contents of the request. The syntax of the request content was correct.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1card-accounts~1{cardAccountId}~1deactivate/post/responses/400/content/application~1json/schema'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /cards/available-cards:
    get:
      summary: Available Card Configs
      description: Returns a list of card configurations which are available for the API user to issue for the given organization. Pliant describes cards with a so called `cardConfig`. The card config describes all relevant aspects of a card, like the look of the card or the type of the card. Card configs can be used to issue new cards and they then replace the old `type` field of the card issuing.
      tags:
      - Cards
      operationId: get-available-cards
      parameters:
      - name: organizationId
        required: true
        description: The unique identifier of the organization.
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                - cardConfigs
                properties:
                  cardConfigs:
                    type: array
                    description: A list of card configs which are available for the API user to issue for the given organization.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The unique identifier of the card config.
                        accountGroup:
                          type: string
                          description: The account group this card config belongs to.
                        cardConfig:
                          type: string
                          description: The technical name of the card config. This can be used as a parameter for the [card issuing](./issue-card) endpoint.
                        canBeIssued:
                          type: boolean
                          description: Indicates whether new cards can currently be issued using this card config.
                        name:
                          type: string
                          description: The business name of the card config.
                        description:
                          type:
                          - string
                          - 'null'
                          description: A description of the card config.
                        type:
                          type: string
                          description: Determines if the card is virtual or physical.
                          enum:
                          - VIRTUAL
                          - PHYSICAL
                        country:
                          type: string
                          description: The country-availability of the card config in ISO 3166-1 alpha-2 notation.
                          minLength: 2
                          maxLength: 2
                        maxTransactions:
                          type:
                          - integer
                          - 'null'
                          description: The maximum number of transactions which are allowed on cards using this card config. If this is `null`, there is no limit. If this is `1`, the card can only be used once etc.
                        cardDesigns:
                          type: array
                          description: A list of card designs which are available for this specific card config.
                          items:
                            type: object
                            properties:
                              cardDesignId:
                                type: string
                                format: uuid
                                description: The unique identifier of the card design.
                              cardDesignLogoName:
                                type:
                                - string
                                - 'null'
                                description: The name of the card design.
                        fundingType:
                          type:
                          - string
                          - 'null'
                          description: '* `CHARGE` - normal (non-benefit) credit card

                            * `LOAD_BASED_ACCRUING` - benefit card where money not spent is transferred to the next month

                            * `LOAD_BASED_NON_ACCRUING` - benefit card where money not spent is lost end of month

                            * `BALANCE_BASED` - benefit card with a standing balance that persists across months and is spent down until depleted (no monthly reset).

                            '
                          enum:
                          - CHARGE
                          - LOAD_BASED_ACCRUING
                          - LOAD_BASED_NON_ACCRUING
                          - BALANCE_BASED
                        loadBasedSettings:
                          type:
                          - object
                          - 'null'
                          description: 'Defines the load configuration for this card config.

                            Only filled for cards with `LOAD_BASED_ACCRUING` or `LOAD_BASED_NON_ACCRUING` funding type.

                            '
                          properties:
                            fixedFrequency:
                              type: string
                              description: 'The frequency at which the card is loaded.

                                * `MONTHLY` - loaded once per month

                                * `QUARTERLY` - loaded once per quarter

                                * `ANNUAL` - loaded once per year

                                '
                              enum:
                              - MONTHLY
                              - QUARTERLY
                              - ANNUAL
                            fixedAmount:
                              type: object
                              description: The fixed amount loaded onto the card at each load interval.
                              properties:
                                value:
                                  type: number
                                  description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                                currency:
                                  type: string
                                  description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        clickToPaySupported:
                          type: boolean
                          description: Whether this card configuration supports Visa Click to Pay enrollment. Only Visa cards (excluding Travel Purchasing Cards) support Click to Pay.
                        expiryPeriodsInMonths:
                          description: Defines available expiry periods for this card config in months.
                          type: array
                          items:
                            type: integer
                        cardAccounts:
                          type: array
                          description: The set of card account IDs associated with this card config.
                          items:
                            type: string
                            format: uuid
                        cardControls:
                          type: object
                          description: A summary of the card control settings available for this card config, indicating which controls are enabled, editable, and required.
                          properties:
                            categories:
                              type: object
                              description: Card controls based on merchant category. Keys are category control types (`MCC`, `CATEGORY`).
                              additionalProperties:
                                $ref: '#/paths/~1cards~1available-cards/get/responses/200/content/application~1json/schema/properties/cardConfigs/items/properties/cardControls/properties/dates/additionalProperties'
                            merchants:
                              type: object
                              description: Card controls based on specific merchants. Keys are merchant control types (`MATCH_TERM`, `MID`, `PMDB_ID`).
                              additionalProperties:
                                $ref: '#/paths/~1cards~1available-cards/get/responses/200/content/application~1json/schema/properties/cardConfigs/items/properties/cardControls/properties/dates/additionalProperties'
                            dates:
                              type: object
                              description: Card controls based on date restrictions. Keys are date control types (`FIXED`, `WEEKLY`, `MONTHLY`, `YEARLY`).
                              additionalProperties:
                                type: object
                                description: Describes the availability of a specific card control for cards issued with this card config.
                                required:
                                - enabled
                                - editable
                                - required
                                properties:
                                  enabled:
                                    type: boolean
                                    description: Whether this card control is enabled for cards using this card config.
                                  editable:
                                    type: boolean
                                    description: Whether cardholders or card managers can change this control on individual cards.
                                  required:
                                    type: boolean
                                    description: Whether this control must always be set and cannot be removed from cards using this card config.
                            times:
                              type: object
                              description: Card controls based on time-of-day restrictions. Keys are time control types (`TIMERANGE`).
                              additionalProperties:
                                $ref: '#/paths/~1cards~1available-cards/get/responses/200/content/application~1json/schema/properties/cardConfigs/items/properties/cardControls/properties/dates/additionalProperties'
                            locations:
                              type: object
                              description: Card controls based on geographic location. Keys are location control types (`POSTAL_CODE`, `REGION`).
                              additionalProperties:
                                $ref: '#/paths/~1cards~1available-cards/get/responses/200/content/application~1json/schema/properties/cardConfigs/items/properties/cardControls/properties/dates/additionalProperties'
                            acceptanceMethods:
                              type: object
                              description: Card controls based on payment acceptance method. Keys are acceptance method types (`ONLINE`, `MOBILE_WALLET`, `MANUAL_ENTRY`, `CONTACTLESS`, `CHIP_DIP`, `NOT_AVAILABLE`, `MAGNETIC_STRIPE`, `OTHER`).
                              additionalProperties:
                                $ref: '#/paths/~1cards~1available-cards/get/responses/200/content/application~1json/schema/properties/cardConfigs/items/properties/cardControls/properties/dates/additionalProperties'
                            countries:
                              description: Card control settings for country-based restrictions.
                              allOf:
                              - $ref: '#/paths/~1cards~1available-cards/get/responses/200/content/application~1json/schema/properties/cardConfigs/items/properties/cardControls/properties/dates/additionalProperties'
                        copilotAllowed:
                          type: boolean
                          description: Indicates whether the Pliant Copilot feature is available for cards using this card config.
                        transactionCountLimitSupported:
                          type: boolean
                          description: Indicates whether a transaction count limit can be configured on cards using this card config.
                        validityPeriodEnabled:
                          type: boolean
                          description: Indicates whether a custom validity period can be set on cards using this card config.
                        premiumProductType:
                          type:
                          - string
                          - 'null'
                          description: The premium product type associated with this card config, if applicable.
                        network:
                          type: string
                          description: The card network (e.g. `VISA`, `MASTERCARD`) for this card config.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /cards/details:
    post:
      summary: Card Details
      description: 'Returns card details for one or more cards depending on the given input. You can also request card details per cardholder(s) or organization(s).

        The API returns all card details to the given input which can be found in the system. So you can also combine the different input fields (OR relation).

        Be aware that the usage of cardholder or organizations IDs most likely add multiple card details themselves. Also cardholders can be part of multiple organizations, thus when searching via cardholder IDs, it might return more data than it would for just one organization this cardholder is part of.

        At least one parameter has to be set.


        **This endpoint has changed in comparison to the previous version of the API.** The following changes were made:

        - added `cardControls` to response body

        - changed the enumeration for the status field in the response body

        - deprecated `type` and replaced it with `cardConfig`'
      tags:
      - Cards
      operationId: get-multiple-card-details
      requestBody:
        required: true
        description: All fields are optional
        content:
          application/json:
            schema:
              type: object
              properties:
                cardIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                cardholderIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                organizationIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                      description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
                    limit:
                      type: integer
                      description: The number of records to return per page.
                    sortBy:
                      type: object
                      description: The field to sort by and the direction to sort by.
                      properties:
                        field:
                          type: string
                          description: The field to sort by.
                          enum:
                          - organizationId
                          - status
                          - cardholderId
                          - updatedAt
                          default: updatedAt
                        direction:
                          description: The direction to sort by.
                          type: string
                          enum:
                          - ASC
                          - DESC
                          default: ASC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        cardId:
                          type: string
                          format: uuid
                          description: The unique identifier of the card.
                        cardRequestId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: If this card originated from a card request, this field contains the unique identifier of the card request.
                        organizationId:
                          type: string
                          format: uuid
                          description: The unique identifier of the organization, this card belongs to.
                        cardholderId:
                          type: string
                          format: uuid
                          description: The unique identifier of the cardholder, this card belongs to.
                        cardAccountId:
                          type: string
                          format: uuid
                          description: The unique identifier of the card account, this card belongs to.
                        type:
                          type:
                          - string
                          - 'null'
                          deprecated: true
                          description: 'Deprecated, please use `cardConfig` instead.

                            `VIRTUAL` - Virtual credit card

                            `SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)

                            `PHYSICAL` - Physical credit card

                            `BLACK` - Physical black premium credit card

                            `TRAVEL` - Virtual cards used specifically in travel industry related use cases

                            '
                          enum:
                          - VIRTUAL
                          - SINGLE_USE
                          - PHYSICAL
                          - BLACK
                          - TRAVEL
                        cardConfig:
                          type: string
                          description: The Pliant card configuration of this card. This describes all feature of this card in one single configuration, e.g. the type of the card and also the design of the card etc. It replaces the deprecated card `type`. Please refer to the [guide section](/docs/card-entity) to learn more about possible values.
                        status:
                          type: string
                          description: 'The status of the card.


                            **Deprecation Notice:** The status values `PENDING_ACTIVATION`, `PENDING_ISSUANCE`, and `PENDING_REGISTRATION` are deprecated and will be mapped to `PENDING` with appropriate `pendingDetails` in the future. Use `PENDING` with the corresponding `pendingDetails` value instead.

                            '
                          enum:
                          - PENDING
                          - PENDING_ACTIVATION
                          - PENDING_ISSUANCE
                          - PENDING_REGISTRATION
                          - REQUEST_APPROVED
                          - REQUESTED
                          - REQUEST_CANCELLED
                          - REQUEST_REJECTED
                          - ACTIVE
                          - LOCKED
                          - LOCKED_PIN
                          - EXPIRED
                          - TERMINATED
                          - TERMINATED_LOST
                          - TERMINATED_STOLEN
                          x-enumDescriptions:
                            PENDING: Card is in a pending state. Check `pendingDetails` for the specific reason.
                            PENDING_ACTIVATION: '~~(Deprecated) Use `PENDING` with `pendingDetails: PENDING_ACTIVATION` instead.~~'
                            PENDING_ISSUANCE: '~~(Deprecated) Use `PENDING` with `pendingDetails: PENDING_ISSUANCE` instead.~~'
                            PENDING_REGISTRATION: '~~(Deprecated) Use `PENDING` with `pendingDetails: PENDING_REGISTRATION` instead.~~'
                            REQUEST_APPROVED: Card request has been approved.
                            REQUESTED: Card has been requested.
                            REQUEST_CANCELLED: Card request has been cancelled.
                            REQUEST_REJECTED: Card request has been rejected.
                            ACTIVE: Card is active and can be used.
                            LOCKED: Card is locked.
                            LOCKED_PIN: Card is locked due to PIN issues.
                            EXPIRED: Card has expired.
                            TERMINATED: Card has been terminated.
                            TERMINATED_LOST: Card has been terminated because it was lost.
                            TERMINATED_STOLEN: Card has been terminated because it was stolen.
                        pendingDetails:
                          type:
                          - string
                          - 'null'
                          description: 'The internal reason for a card''s pending state. This field is only populated when `status` is `PENDING` or one of the deprecated `PENDING_...` statuses, and will be `null` for all non-pending statuses.

                            '
                          enum:
                          - PENDING_ACTIVATION
                          - PENDING_ISSUANCE
                          - PENDING_REGISTRATION
                          - PENDING_VALIDITY
                          - PENDING_SANCTION_SCREEN
                          - PENDING_INFORMATION
                          x-enumDescriptions:
                            PENDING_ACTIVATION: Card is pending activation.
                            PENDING_ISSUANCE: Card is pending issuance.
                            PENDING_REGISTRATION: Card is pending registration.
                            PENDING_VALIDITY: Card is pending validity period.
                            PENDING_SANCTION_SCREEN: Card is pending sanction screening.
                            PENDING_INFORMATION: Card is pending additional information.
                        label:
                          type:
                          - string
                          - 'null'
                          description: A short text describing the card. Available only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`. The maximum length is 40 characters.
                          maxLength: 40
                        purpose:
                          type:
                          - string
                          - 'null'
                          description: A short text describing the card. Available only for virtual cards with a `cardConfig` containing `SINGLE_USE`, the maximum length is 40 characters.
                          maxLength: 40
                        refNum:
                          type:
                          - string
                          - 'null'
                          description: The last 4 digits of the PAN (payment card number), better known as the credit card number. It can be `null` e.g. for terminated cards.
                        issuingDate:
                          type:
                          - string
                          - 'null'
                          description: Date-time of card issuing, e.g. `2023-08-23T14:28:53.600608Z`. Can be null e.g. for cards which are requested by a [cardholder](/docs/cardholder-entity) but the request is declined.
                          format: date-time
                        expiryDate:
                          type:
                          - string
                          - 'null'
                          description: Date-time (without nanoseconds) when card expires, e.g. `2026-07-31T23:59:59Z`. For cards with type `SINGLE_USE` this is set to 12 months automatically and every value put here is ignored. Can be null e.g. for cards which are requested by a [cardholder](/docs/cardholder-entity) but the request is declined.
                          format: date-time
                        limit:
                          type: object
                          description: The limit of the card, describing the overall limit of this card. It might get reset regularly depending on the field `limitRenewFrequency`.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        transactionLimit:
                          type: object
                          description: The transaction limit of the card, describing the maximum amount a single transaction can have on this card.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        spendingBalance:
                          type: object
                          description: The spending balance of the card.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        availableBalance:
                          type: object
                          description: The available balance of the card.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        token:
                          type: string
                          description: The network token of the card.
                        cardDesign:
                          type: string
                          description: The card design of the card on Thredd (Pliant's credit card processor) side.
                        productRef:
                          type: string
                          description: The product reference of the card on Thredd (Pliant's credit card processor) side. This field is deprecated and will be removed in the future. Use `cardDesignId` instead.
                          deprecated: true
                        platformFee:
                          type: boolean
                          description: Whether the card is used for the internal Pliant platform fee or not.
                        limitPeriodEnd:
                          type: string
                          description: Date-time (without nanoseconds) when the current limit period ends, e.g. `2023-09-30T23:59:59Z`.
                          format: date-time
                        limitRenewDate:
                          type: string
                          description: Date when the limit will be renewed, e.g. `2023-10-01`.
                          format: date
                        limitRenewFrequency:
                          type: string
                          enum:
                          - DAILY
                          - WEEKLY
                          - MONTHLY
                          - QUARTERLY
                          - ANNUAL
                          - TOTAL
                          description: "Describes how often the limit of the card is renewed.\n  * `DAILY` - The card limit is renewed every day\n  * `WEEKLY` - The card limit is renewed every week\n  * `MONTHLY` - The card limit is renewed every calendar month\n  * `QUARTERLY` - The card limit is renewed every calendar quarter\n  * `ANNUAL` - The card limit is renewed every year\n  * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.\n"
                        customFirstName:
                          type:
                          - string
                          - 'null'
                          description: Optional first name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                        customLastName:
                          type:
                          - string
                          - 'null'
                          description: Optional last name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                        cardControls:
                          type:
                          - object
                          - 'null'
                          description: The card controls of the card, if any apply.
                          $ref: '#/paths/~1cards~1{cardId}~1card-controls/put/requestBody/content/application~1json/schema/allOf/0'
                        replacedByCardId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: Filled, if this card was replaced by another card.
                        replacedCardId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: Filled, if this card replaced another card.
                        replacementReason:
                          type:
                          - string
                          - 'null'
                          description: Describes the reason for the card replacement, if any happened.
                          enum:
                          - DAMAGED
                          - EXPIRING_SOON
                          - LOST
                          - OTHER
                          - STOLEN
                        shippingDate:
                          type:
                          - string
                          - 'null'
                          description: Date-time when the physical card was shipped, e.g. `2023-10-16T11:34:59.595Z`. This field is empty for all other types of cards, or when the physical card is not shipped yet.
                          format: date-time
                        panAlias:
                          type:
                          - string
                          - 'null'
                          description: The PAN alias of the card. This is not the real credit card number (PAN) but a alias version of it.
                        validFrom:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Optional field to describe a fixed date range in which the card is usable for purchases. Outside of this date range, the card cannot be used for any purchases, only for zero-amount card-checks, and is shown with `status` `PENDING`. If not provided, the card is active immediately. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the provided date is already a valid day to use the card. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The earliest possible date is the current date. The `validFrom` date needs to be before the `validTo` date. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                          example: '2023-12-01'
                        validTo:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: Optional field to describe a fixed date range in which the card is usable for purchases. After the specified date, the card is automatically terminated. If not provided, the card is active until the `validityPeriod` ends. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the card will be terminated one day after this date. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The earliest possible date is the current date. The latest possible date is the end date of the `validityPeriod`. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                          example: '2023-12-31'
                        validTimezone:
                          type: string
                          description: Optional field to describe the timezone for the `validFrom` and `validTo` fields. This field is mandatory if `validFrom` and `validTo` fields are used. A list of valid timezones can be found in our [guide section](/docs/card-controls-1).
                        maxTransactionCount:
                          type: number
                          minimum: 1
                          maximum: 999999999
                          description: Optional field to describe the maximum number of transactions within the range of `1..999999999` that can be performed with this card. If not provided, the card can be used for an unlimited number of transactions until the card expires.
                        customFields:
                          type: array
                          description: The [custom fields](/docs/custom-fields-on-transactions) set on this card. These [custom fields](/docs/custom-fields-on-transactions) are used as default values for every transaction made with this card.
                          items:
                            type: object
                            $ref: '#/paths/~1cards~1{cardId}~1custom-fields/patch/responses/202/content/application~1json/schema/items'
                        cardDesignId:
                          type: string
                          format: uuid
                          description: The unique identifier of the card design used for this specific card.
                        cardDesignLogoName:
                          type:
                          - string
                          - 'null'
                          description: The name of the card design used for this specific card.
                        maskedPan:
                          type: string
                          description: The masked PAN of the card. This is the real credit card number (PAN) but with the middle digits replaced by `*`. E.g. `481063******6054`.
                        benefit:
                          type: boolean
                          description: Indicates that the card was issued as an employee benefit.
                        copilots:
                          type:
                          - object
                          - 'null'
                          description: Optional feature for `TRAVEL` cards. The copilot also has access to the card and its card details alongside with the cardholder of the card itself.
                          properties:
                            cardholderIds:
                              type: array
                              items:
                                type: string
                                format: uuid
                              description: The IDs of the cardholders assigned as copilots to the card.
                            teamIds:
                              type: array
                              items:
                                type: string
                                format: uuid
                              description: The IDs of the teams assigned as copilots to the card.
                        clickToPayInfo:
                          $ref: '#/paths/~1cards/post/responses/200/content/application~1json/schema/properties/clickToPayInfo'
                        fundingType:
                          type: string
                          description: '* `CHARGE` - normal (non-benefit) credit card

                            * `LOAD_BASED_ACCRUING` - benefit card where money not spent is transferred to the next month

                            * `LOAD_BASED_NON_ACCRUING` - benefit card where money not spent is lost end of month

                            * `BALANCE_BASED` - benefit card with a standing balance that persists across months and is spent down until depleted (no monthly reset).

                            '
                          enum:
                          - CHARGE
                          - LOAD_BASED_ACCRUING
                          - LOAD_BASED_NON_ACCRUING
                          - BALANCE_BASED
                        nextLoadDate:
                          type: string
                          format: date
                          description: For cards that are loaded periodically, indicates the date when the card will be loaded the next time.
                        additionalLimits:
                          type: array
                          description: Additional limits on this card. Empty when none are configured.
                          items:
                            $ref: '#/paths/~1cards/post/responses/200/content/application~1json/schema/properties/additionalLimits/items'
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /cards/instant:
    post:
      summary: Issue Card with Cardholder (Instant)
      description: 'This endpoint offers similar card issuing functionality as the main card issuing and cardholder creation endpoint, but specifically allows for a _synchronous_ and _instant_ card issuing and cardholder creation,

        whereas the main card issuing flow works asynchronously and requires the consumption of a callback to confirm the card is actually active.

        This endpoint issues cards instantly in a synchronous fashion. Meaning the card is active and usable when this endpoint returns a `200 Ok` response.

        The use case being here a fully automated card issuing flow, followed by an immediate card usage on API level for normally PCI-DSS certified companies.

        Please note, that the sensitive card data still needs to be fetched separately after issuing a new card (if PCI-DSS compliant).


        **This endpoint should only be used if aligned with Pliant upfront. In 90% of cases, you want to use the normal card issuing endpoint instead, as linked above.**'
      tags:
      - Cards
      operationId: issue-card-with-cardholder-instant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/paths/~1cards/post/requestBody/content/application~1json/schema/allOf/0'
      responses:
        '200':
          description: Ok. The card can be directly used now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardId:
                    type: string
                    format: uuid
                    description: The Pliant card id (UUIDv4) of the card.
                  type:
                    type:
                    - string
                    - 'null'
                    deprecated: true
                    enum:
                    - VIRTUAL
                    - SINGLE_USE
                    - PHYSICAL
                    - BLACK
                    - TRAVEL
                    description: 'Deprecated, please use `cardConfig` instead.

                      `VIRTUAL` - Virtual credit card

                      `SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)

                      `PHYSICAL` - Physical credit card

                      `BLACK` - Physical black premium credit card

                      `TRAVEL` - Virtual cards used specifically in travel industry related use cases

                      Either `type` or `cardConfig` has to be provided. Please prefer `cardConfig`.

                      '
                  cardConfig:
                    type: string
                    description: The Pliant card configuration of this card. This describes all feature of this card in one single configuration, e.g. the type of the card and also the design of the card etc. It replaces the deprecated card `type`. Please refer to the [guide section](/docs/card-entity) to learn more about possible values. Either `type` or `cardConfig` has to be provided. Please prefer `cardConfig`.
                  cardDesignId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The unique identifier of the card design used for this card. Present only for virtual cards.
                  cardholderId:
                    type: string
                    format: uuid
                    description: The ID of the [cardholder](/docs/cardholder-entity) this card is issued for.
                  organizationId:
                    type: string
                    format: uuid
                    description: The ID of the organization this card is issued for.
                  cardAccountId:
                    type: string
                    format: uuid
                    description: The ID of the [card account](/docs/card-account) this card is issued for.
                  transactionLimit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  monthlyLimit:
                    type: object
                    deprecated: true
                    description: Use `limit` instead
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: '* `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month

                      * `QUARTERLY` - The card limit is renewed every calendar quarter

                      * `ANNUAL` - The card limit is renewed every year

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                  expiryDate:
                    type: string
                    format: date-time
                  label:
                    type:
                    - string
                    - 'null'
                    description: Available only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`. The maximum length is 40 characters.
                    maxLength: 40
                  purpose:
                    type:
                    - string
                    - 'null'
                    description: Available only for cards with type `SINGLE_USE`
                  customFirstName:
                    type:
                    - string
                    - 'null'
                    description: Optional first name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                  customLastName:
                    type:
                    - string
                    - 'null'
                    description: Optional last name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                  cardControls:
                    type:
                    - object
                    - 'null'
                    $ref: '#/paths/~1cards~1{cardId}~1card-controls/put/requestBody/content/application~1json/schema/allOf/0'
                  validFrom:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases. Outside of this date range, the card cannot be used for any purchases, only for zero-amount card-checks, and is shown with `status` `PENDING`. If not provided, the card is active immediately. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the provided date is already a valid day to use the card. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The earliest possible date is the current date. The `validFrom` date needs to be before the `validTo` date. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                    example: '2023-12-01'
                  validTo:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases. After the specified date, the card is automatically terminated. If not provided, the card is active until the `validityPeriod` ends. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the card will be terminated one day after this date. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The latest possible date is the end date of the `validityPeriod`. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                    example: '2023-12-31'
                  validTimezone:
                    type: string
                    description: Optional field to describe the timezone for the `validFrom` and `validTo` fields. This field is mandatory if `validFrom` and `validTo` fields are used. A list of valid timezones can be found in our [guide section](/docs/card-controls-1).
                  maxTransactionCount:
                    type: number
                    minimum: 1
                    maximum: 999999999
                    description: Optional field to describe the maximum number of transactions within the range of `1..999999999` that can be performed with this card. If not provided, the card can be used for an unlimited number of transactions until the card expires.
                  clickToPayInfo:
                    $ref: '#/paths/~1cards/post/responses/200/content/application~1json/schema/properties/clickToPayInfo'
                  customFields:
                    type: array
                    description: The [custom fields](/docs/custom-fields-on-transactions) set on this card. These [custom fields](/docs/custom-fields-on-transactions) are used as default values for every transaction made with this card. If no [custom fields](/docs/custom-fields-on-transactions) are assigned to the card, we return an empty list.
                    items:
                      type: object
                      $ref: '#/paths/~1cards~1{cardId}~1custom-fields/patch/responses/202/content/application~1json/schema/items'
                  maskedPan:
                    type: string
                    description: The masked PAN of the card. This is the real credit card number (PAN) but with the middle digits replaced by `*`. E.g. `481063******6054`.
                  teamId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The ID of the team the card is issued for.
                  teamName:
                    type:
                    - string
                    - 'null'
                    description: Name of the team the card is issued for.
                  projectId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The ID of the project the card is issued for.
                  projectName:
                    type:
                    - string
                    - 'null'
                    description: Name of the project the card is issued for.
                  copilots:
                    type:
                    - object
                    - 'null'
                    description: Optional feature for `TRAVEL` cards. The copilot also has access to the card and its card details alongside with the cardholder of the card itself.
                    properties:
                      cardholderIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the cardholders assigned as copilots to the card.
                      teamIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the teams assigned as copilots to the card.
