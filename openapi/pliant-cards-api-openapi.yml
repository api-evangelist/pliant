  /cards/instant-pci:
    post:
      summary: Issue Card with Cardholder (Instant as PCI-DSS)
      description: 'This endpoint offers similar card issuing functionality as the main card issuing and cardholder creation endpoint, but specifically allows for a _synchronous_ and _instant_ card issuing and cardholder creation,

        **including PCI-DSS compliant sensitive card data retrieval**, which can be then found in the response as object `sensitiveCardData`.

        This endpoint issues cards instantly in a synchronous fashion and returns the sensitive card data like the cards PAN and CVV directly.

        Meaning the card is active and usable when this endpoint returns a `200 Ok` response and you can directly use the card data to do a purchase of any kind.

        The use case being here a fully automated card issuing flow, followed by an immediate card usage on API level.


        **This endpoint can only be used after a separate configuration done by Pliant and the partner using this endpoint needs to be PCI-DSS certified!**


        **A dedicated host URL `pci-api.getpliant.com` is used for this endpoint!** Please refer to the documentation for more information.'
      tags:
      - Cards
      operationId: issue-card-with-cardholder-instant-with-pci
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/paths/~1cards/post/requestBody/content/application~1json/schema/allOf/0'
      responses:
        '200':
          description: Ok. The card can be directly used now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardId:
                    type: string
                    format: uuid
                    description: The Pliant card id (UUIDv4) of the card.
                  type:
                    type:
                    - string
                    - 'null'
                    deprecated: true
                    enum:
                    - VIRTUAL
                    - SINGLE_USE
                    - PHYSICAL
                    - BLACK
                    - TRAVEL
                    description: 'Deprecated, please use `cardConfig` instead.

                      `VIRTUAL` - Virtual credit card

                      `SINGLE_USE` - One-time virtual credit card (only one authorization allowed per card)

                      `PHYSICAL` - Physical credit card

                      `BLACK` - Physical black premium credit card

                      `TRAVEL` - Virtual cards used specifically in travel industry related use cases

                      Either `type` or `cardConfig` has to be provided. Please prefer `cardConfig`.

                      '
                  cardConfig:
                    type: string
                    description: The Pliant card configuration of this card. This describes all feature of this card in one single configuration, e.g. the type of the card and also the design of the card etc. It replaces the deprecated card `type`. Please refer to the [guide section](/docs/card-entity) to learn more about possible values. Either `type` or `cardConfig` has to be provided. Please prefer `cardConfig`.
                  cardDesignId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The unique identifier of the card design used for this card. Present only for virtual cards.
                  cardholderId:
                    type: string
                    format: uuid
                    description: The ID of the [cardholder](/docs/cardholder-entity) this card is issued for.
                  organizationId:
                    type: string
                    format: uuid
                    description: The ID of the organization this card is issued for.
                  cardAccountId:
                    type: string
                    format: uuid
                    description: The ID of the [card account](/docs/card-account) this card is issued for.
                  transactionLimit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  monthlyLimit:
                    type: object
                    deprecated: true
                    description: Use `limit` instead
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limit:
                    type: object
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: '* `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month

                      * `QUARTERLY` - The card limit is renewed every calendar quarter

                      * `ANNUAL` - The card limit is renewed every year

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                  expiryDate:
                    type: string
                    format: date-time
                  label:
                    type:
                    - string
                    - 'null'
                    description: Available only for virtual cards with a `cardConfig` containing `VIRTUAL` or `TRAVEL`. The maximum length is 40 characters.
                    maxLength: 40
                  purpose:
                    type:
                    - string
                    - 'null'
                    description: Available only for cards with type `SINGLE_USE`
                  customFirstName:
                    type:
                    - string
                    - 'null'
                    description: Optional first name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                  customLastName:
                    type:
                    - string
                    - 'null'
                    description: Optional last name on `TRAVEL` cards which is used on the card, instead of the regular [cardholder](/docs/cardholder-entity) name. If empty, the regular [cardholder](/docs/cardholder-entity) name is used.
                  cardControls:
                    type:
                    - object
                    - 'null'
                    $ref: '#/paths/~1cards~1{cardId}~1card-controls/put/requestBody/content/application~1json/schema/allOf/0'
                  validFrom:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases. Outside of this date range, the card cannot be used for any purchases, only for zero-amount card-checks, and is shown with `status` `PENDING`. If not provided, the card is active immediately. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the provided date is already a valid day to use the card. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The earliest possible date is the current date. The `validFrom` date needs to be before the `validTo` date. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                    example: '2023-12-01'
                  validTo:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Optional field to describe a fixed date range in which the card is usable for purchases. After the specified date, the card is automatically terminated. If not provided, the card is active until the `validityPeriod` ends. Date needs to be provided as `yyyy-mm-dd` and is treated inclusive, meaning the card will be terminated one day after this date. If used, the parallel usage of card controls regarding `dates` and/or `times` is not allowed and the `validityPeriod` will be set to 36 months automatically. The latest possible date is the end date of the `validityPeriod`. The fields `validFrom`, `validTo` and `validTimezone` need to be used together, if used at all.
                    example: '2023-12-31'
                  validTimezone:
                    type: string
                    description: Optional field to describe the timezone for the `validFrom` and `validTo` fields. This field is mandatory if `validFrom` and `validTo` fields are used. A list of valid timezones can be found in our [guide section](/docs/card-controls-1).
                  maxTransactionCount:
                    type: number
                    minimum: 1
                    maximum: 999999999
                    description: Optional field to describe the maximum number of transactions within the range of `1..999999999` that can be performed with this card. If not provided, the card can be used for an unlimited number of transactions until the card expires.
                  clickToPayInfo:
                    $ref: '#/paths/~1cards/post/responses/200/content/application~1json/schema/properties/clickToPayInfo'
                  customFields:
                    type: array
                    description: The [custom fields](/docs/custom-fields-on-transactions) set on this card. These [custom fields](/docs/custom-fields-on-transactions) are used as default values for every transaction made with this card. If no [custom fields](/docs/custom-fields-on-transactions) are assigned to the card, we return an empty list.
                    items:
                      type: object
                      $ref: '#/paths/~1cards~1{cardId}~1custom-fields/patch/responses/202/content/application~1json/schema/items'
                  sensitiveCardData:
                    type: object
                    description: The sensitive card data like the PAN and CVV of the card. This is only available for PCI-DSS certified companies.
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: The Pliant internal ID of the card.
                      pan:
                        type: string
                        minLength: 16
                        maxLength: 16
                        description: The PAN (Primary Account Number) of the card, also known as the credit card number.
                      cvv:
                        type: string
                        minLength: 3
                        maxLength: 3
                        description: The CVV (Card Verification Value) of the card, also known as the card security code.
                      expiryMonth:
                        type: integer
                        description: The expiry month of the card.
                      expiryYear:
                        type: integer
                        description: The expiry year of the card.
                  teamId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The ID of the team the card is issued for.
                  teamName:
                    type:
                    - string
                    - 'null'
                    description: Name of the team the card is issued for.
                  projectId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: The ID of the project the card is issued for.
                  projectName:
                    type:
                    - string
                    - 'null'
                    description: Name of the project the card is issued for.
                  copilots:
                    type:
                    - object
                    - 'null'
                    description: Optional feature for `TRAVEL` cards. The copilot also has access to the card and its card details alongside with the cardholder of the card itself.
                    properties:
                      cardholderIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the cardholders assigned as copilots to the card.
                      teamIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the teams assigned as copilots to the card.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
