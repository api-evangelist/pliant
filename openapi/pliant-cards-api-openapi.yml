  /cards/limits/{cardId}:
    put:
      summary: Update Card Limit
      description: 'Change the card limit for a given virtual or physical card, as long as the card is not terminated. This is unrelated to the renew frequency of the card.

        Meaning you can update the limit of a card with a `TOTAL` renew frequency (equals no limit renewal) as well as a `MONTHLY` renew frequency etc.


        **Additional limits:** Use the `additionalLimits` field to create, update, or remove additional limits on the card in the same request.

        - Entries **with** an `id` → update the matching existing additional limit.

        - Entries **without** an `id` → create a new additional limit.

        - Existing additional limits **omitted** from the array → soft-delete (removed).

        - Passing `null` or omitting `additionalLimits` → leave existing additional limits unchanged.

        - Passing an **empty array `[]`** → remove all additional limits from the card.


        **Response:** This endpoint returns `204 No Content`. To read the updated limit state use `GET /api/cards/{cardId}` or subscribe to the `CARD_LIMITS_CHANGED` callback.'
      tags:
      - Cards
      operationId: update-card-limit
      parameters:
      - name: cardId
        in: path
        description: The ID of the card to update the limit for.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - limit
                - transactionLimit
                properties:
                  limit:
                    type: object
                    description: The limit of the card. The limit renews according to the `limitRenewFrequency` or never, if `limitRenewFrequency` is set to `TOTAL`.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar. This has to match the currency of the respective [card account](/docs/card-account)!
                  limitRenewFrequency:
                    type: string
                    enum:
                    - DAILY
                    - WEEKLY
                    - MONTHLY
                    - QUARTERLY
                    - ANNUAL
                    - TOTAL
                    description: 'The frequency of the card limit renewal.

                      * `DAILY` - The card limit is renewed every day

                      * `WEEKLY` - The card limit is renewed every week

                      * `MONTHLY` - The card limit is renewed every calendar month, this is the default setting.

                      * `QUARTERLY` - The card limit is renewed every calendar quarter.

                      * `ANNUAL` - The card limit is renewed every year.

                      * `TOTAL` - The card limit is never going to be renewed. After the limit is spent the card cannot be used anymore.

                      '
                  transactionLimit:
                    type: object
                    description: The transaction limit of the card. Meaning the maximum amount of a single transaction. This is always below or equal to the `limit` of the card.
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar. This has to match the currency of the respective [card account](/docs/card-account)!
                  maxTransactionCount:
                    type: number
                    minimum: 1
                    maximum: 999999999
                    description: 'Optional field to describe the maximum number of transactions within the range of `1..999999999` that can be performed with this card.

                      If not provided, the card can be used for an unlimited number of transactions until the card expires.

                      '
                  monthlyLimit:
                    type: object
                    deprecated: true
                    properties:
                      value:
                        type: number
                        description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                      currency:
                        type: string
                        description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar. This has to match the currency of the respective [card account](/docs/card-account)!
              - type: object
                properties:
                  additionalLimits:
                    type:
                    - array
                    - 'null'
                    description: Additional limits to create, update, or remove. See endpoint description for update semantics.
                    items:
                      type: object
                      description: 'An additional limit to set on a card.


                        **Update semantics (applies to `PUT /api/cards/limits/{cardId}`):**

                        - Entries **with** an `id` → update the matching existing additional limit.

                        - Entries **without** an `id` → create a new additional limit.

                        - Existing additional limits **omitted** from the array → soft-delete (removed from the card).

                        - Passing `null` or omitting `additionalLimits` entirely → leave existing additional limits unchanged.

                        - Passing an **empty array `[]`** → remove all additional limits from the card.


                        The `id` field is only meaningful for `PUT /api/cards/limits/{cardId}` and `POST /api/cards/limits/requests`. It is ignored in all other contexts.

                        '
                      properties:
                        id:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: Identifies an existing additional limit to update. Omit or set to null to create a new limit. Only meaningful for `PUT /api/cards/limits/{cardId}` and `POST /api/cards/limits/requests`.
                        limitRenewFrequency:
                          type: string
                          enum:
                          - PER_TRANSACTION
                          - DAILY
                          - WEEKLY
                          - MONTHLY
                          - QUARTERLY
                          - ANNUAL
                          - TOTAL
                          description: 'The renewal frequency for this additional limit. `PER_TRANSACTION` is only valid for additional limits, not for the card''s primary limit.

                            * `PER_TRANSACTION` - Limit applies to each individual transaction.

                            * `DAILY` - The limit is renewed every day.

                            * `WEEKLY` - The limit is renewed every week.

                            * `MONTHLY` - The limit is renewed every calendar month.

                            * `QUARTERLY` - The limit is renewed every calendar quarter.

                            * `ANNUAL` - The limit is renewed every year.

                            * `TOTAL` - The limit is never renewed. Once spent, no further transactions are allowed under this limit.

                            '
                        limit:
                          type: object
                          description: The monetary cap for this additional limit. For unscoped limits and limits with `categories`, `acceptanceMethods`, or `atmWithdrawal` scope, the currency must match the card account currency. For currency-scoped limits (`scope.currency` is set), the currency must match `scope.currency`.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        maxTransactionCount:
                          type:
                          - number
                          - 'null'
                          minimum: 1
                          maximum: 999999999
                          description: Max number of transactions per renewal period (`1..999999999`). Null means no cap.
                        scope:
                          type:
                          - object
                          - 'null'
                          description: 'Restricts when this limit applies. Null for a general (unscoped) limit. At least one of `categories`, `acceptanceMethods`, `atmWithdrawal: true`, or `currency` must be set for a scoped limit.'
                          properties:
                            categories:
                              type:
                              - array
                              - 'null'
                              description: Merchant category types this limit applies to.
                              items:
                                type: string
                                enum:
                                - ADVERTISING_AND_MARKETING
                                - COMPUTING_AND_SOFTWARE
                                - EDUCATION_AND_TRAINING
                                - ELECTRONICS_AND_IT_EQUIPMENT
                                - ENTERTAINMENT_AND_WELLNESS
                                - FOOD_AND_DRINKS
                                - GIFTS_AND_VOUCHERS
                                - HEALTHCARE
                                - MATERIALS_AND_PACKAGING
                                - OFFICE_SUPPLIES_AND_EQUIPMENT
                                - SERVICES
                                - TRAVEL_AND_ACCOMMODATION
                                - OTHER
                            acceptanceMethods:
                              type:
                              - array
                              - 'null'
                              description: The card acceptance methods this limit applies to.
                              items:
                                type: string
                                enum:
                                - ONLINE
                                - MOBILE_WALLET
                                - MANUAL_ENTRY
                                - CONTACTLESS
                                - CHIP_DIP
                                - NOT_AVAILABLE
                                - MAGNETIC_STRIPE
                                - OTHER
                            atmWithdrawal:
                              type:
                              - boolean
                              - 'null'
                              description: When `true`, this additional limit applies to ATM withdrawal transactions.
                            currency:
                              type:
                              - string
                              - 'null'
                              description: 'ISO 4217 currency code this limit applies to, e.g. `PLN` or `USD`. When set, the limit tracks spending in that currency only and is independent of the card''s billing currency.

                                Constraints:

                                * Must differ from the card account''s billing currency.

                                * The `limit` amount currency must equal this value.

                                '
      responses:
        '204':
          description: Ok
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /cards/load:
    post:
      summary: Load Benefit Cards
      description: 'Load money onto a batch of benefit cards. Provide a list of cards and individual amounts to be loaded onto each card.

        If all pre-conditions are fulfilled, then the request is accepted and processed asynchronously. Listen for appropriate `CARD_BALANCE_UPDATED` callbacks.

        If any of the pre-conditions is not fulfilled, the request will be rejected immediately.

        All cards have to be eligible for card loading, i.e. they are active benefit cards and belong to the same organization.

        There has to be enough money on the organization''s card-account.

        All requested amounts must be positive and specified in the card-account''s currency.'
      tags:
      - Cards
      operationId: load-cards-batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cards:
                  type: array
                  items:
                    type: object
                    properties:
                      cardId:
                        type: string
                        format: uuid
                      loadAmount:
                        type: object
                        description: The amount of money to be loaded on this card.
                        properties:
                          value:
                            type: number
                            description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                          currency:
                            type: string
