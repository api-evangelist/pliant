tags:
- name: Card Copilots
  description: This tag is for operations related to card copilots
paths:
  /cards/copilots/subscription:
    post:
      summary: 'Callback: Add/Update'
      description: Subscribe to callbacks for this entity or change an existing callback.
      tags:
      - Card Copilots
      operationId: create-card-copilot-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
                  description: The URL to send the callback to. Must be a valid and reachable URL. We do some basic validation to ensure the URL is syntactically correct and reachable for Pliant. Only HTTPS URLs are supported.
                eventTypes:
                  type: array
                  items:
                    type: string
                    description: 'The event types to subscribe to.

                      '
                    enum:
                    - CARD_COPILOT_CHANGED
              required:
              - callbackUrl
              - eventTypes
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      callbacks:
        cardCopilotChanged:
          '{$request.body#/callbackUrl}':
            post:
              parameters:
              - in: header
                name: X-Organization-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the organization this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Partner-Organization-Id
                schema:
                  type: string
                  description: 'Filled, if the value `partnerOrganizationId` is [set](/reference/update-organization) by the partner on the organization itself. Referencing the organization identifier of the partner. Example value: `abc123`.'
              - in: header
                name: X-Payment-Program-Id
                schema:
                  type: string
                  format: uuid
                  description: 'Referencing the payment program this callback was sent for. See [guides](/docs/callbacks) for more details. Example value: `54e6e7e7-0c23-4a54-bccb-2d3ff2fd02df`.'
              - in: header
                name: X-Callback-Id
                schema:
                  type: string
                  format: uuid
                  description: 'A unique identifier for this callback. Can be used to deduplicate callbacks to achieve idempotent behavior. See [guides](/docs/callbacks) for more details. Example value: `12a03093-eaad-4ae5-9d8d-42e7f6f8b7c6`.'
              - in: header
                name: X-Callback-Created-At
                schema:
                  type: string
                  format: date-time
                  description: 'The date and time when the callback was created. Can be used to reorder callbacks. See [guides](/docs/callbacks) for more details. Example value: `2024-03-15T15:55:58.623375258Z`.'
              requestBody:
                content:
                  application/json:
                    schema:
                      allOf:
                      - $ref: '#/paths/~1cards~1subscription/post/callbacks/cardUpdated/{$request.body#~1callbackUrl}/post/requestBody/content/application~1json/schema/allOf/0'
                      - type: object
                        properties:
                          cardId:
                            type: string
                            format: uuid
                            description: The unique identifier of the card.
                          cardAccountId:
                            type:
                            - string
                            - 'null'
                            format: uuid
                            description: The unique identifier of the card account this card belongs to.
                          cardholderId:
                            type: string
                            format: uuid
                            description: The ID of the cardholder assigned to the card.
                          copilots:
                            type: object
                            description: The copilot also has access to the card and its card details alongside with the cardholder of the card itself.
                            properties:
                              cardholderIds:
                                type: array
                                items:
                                  type: string
                                  format: uuid
                                description: The IDs of the cardholders assigned as copilots to the card.
                              teamIds:
                                type: array
                                items:
                                  type: string
                                  format: uuid
                                description: The IDs of the teams assigned as copilots to the card.
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
    delete:
      summary: 'Callback: Remove'
      description: Remove a callback subscription for this entity.
      tags:
      - Card Copilots
      operationId: remove-card-copilot-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventTypes:
                  type: array
                  description: The event types to unsubscribe from.
                  items:
                    type: string
                    enum:
                    - CARD_COPILOT_CHANGED
              required:
              - eventTypes
      responses:
        '200':
          description: Ok
  /cards/{cardId}/copilots:
    put:
      summary: Update Card Copilots
      description: 'Update the copilots of a specific card. The cardholder and the copilots have access to the card and its card details.

        You need to provide all copilots you want to assign to the card. Copilots that are not provided will be removed from the card.


        **Note: the copilots feature is available for `TRAVEL` cards only.**'
      tags:
      - Card Copilots
      operationId: update-card-copilots
      parameters:
      - name: cardId
        in: path
        required: true
        description: The unique identifier of the card.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardholderIds:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    format: uuid
                  description: The IDs of the cardholders to assign as copilots to the card.
                teamIds:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                    format: uuid
                  description: The IDs of the teams to assign as copilots to the card.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardId:
                    type: string
                    format: uuid
                    description: The ID of the card.
                  copilots:
                    type:
                    - object
                    - 'null'
                    description: The copilot also has access to the card and its card details alongside with the cardholder.
                    properties:
                      cardholderIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the cardholders assigned as copilots to the card.
                      teamIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the teams assigned as copilots to the card.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /cards/{cardId}/copilots/claim:
    put:
      summary: Claim Card As Copilot
      description: 'Claim a card to become the new cardholder for this card. You need to be a copilot of the respective card to claim the card.


        **Note: the copilots feature is available for `TRAVEL` cards only.**'
      tags:
      - Card Copilots
      operationId: claim-card-as-copilot
      parameters:
      - name: cardId
        in: path
        required: true
        description: The unique identifier of the card.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cardholderId:
                  type: string
                  format: uuid
                  description: The ID of the cardholder to assign as the new cardholder of the card.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardId:
                    type: string
                    format: uuid
                    description: The ID of the card.
                  cardholderId:
                    type: string
                    format: uuid
                    description: The ID of the cardholder assigned as the new cardholder of the card.
                  copilots:
                    type:
                    - object
                    - 'null'
                    description: The copilot also has access to the card and its card details alongside with the cardholder of the card itself.
                    properties:
                      cardholderIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the cardholders assigned as copilots to the card.
                      teamIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: The IDs of the teams assigned as copilots to the card.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
