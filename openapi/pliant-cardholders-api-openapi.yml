                  description: If `true`, the [cardholder](/docs/cardholder-entity) is the owner of the organization. The owner is allowed to administer all settings of the organization on the Pliant platform. If `false`, the [cardholder](/docs/cardholder-entity) is a plain [cardholder](/docs/cardholder-entity) with limited rights on the Pliant platform. Only works if [cardholder](/docs/cardholder-entity) was invited via API or Pliant apps.
