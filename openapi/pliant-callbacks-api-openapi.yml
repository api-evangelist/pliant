        description: Filter by status. The status of the callback. The callback starts as `UNSENT`, transitions to `IN_PROGRESS`, then to `SENT` or `FAILED`. If the callback is skipped (mostly due to manual interventions), it will be marked as `SKIPPED`. The status `TO_BE_SEND_IMMEDIATELY` is a short-lived, intermediate status similar to `UNSENT`.
        schema:
          type: string
