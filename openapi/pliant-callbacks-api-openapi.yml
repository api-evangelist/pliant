security:
- bearerAuth: []
tags:
- name: Callbacks
  description: This tag is for operations related to callbacks
paths:
  /callbacks:
    get:
      summary: Search Callbacks
      description: Get a list of all callbacks we produced for you, whether we could send them to you or not. This log contains all callbacks Pliant produced, together with a status and further metadata to let you investigate problems etc. You can add optional filters to narrow down the results. To get the payload of a specific callback, use the `GET /callbacks/{callbackId}` endpoint. To re-trigger delivery of one or more callbacks, use the `POST /callbacks/resend` endpoint.
      tags:
      - Callbacks
      operationId: search-callbacks
      parameters:
      - name: organizationId
        in: query
        description: Filter by organization id.
        schema:
          type: string
          format: uuid
        required: false
      - name: entityId
        in: query
        deprecated: true
        description: Filter by single entity id.
        schema:
          type: string
          format: uuid
        required: false
      - name: entityIds
        in: query
        description: Filter by (multiple) entity ids.
        schema:
          type: array
          items:
            type: string
            format: uuid
        required: false
      - name: eventType
        in: query
        description: Filter by event type.
        schema:
          type: string
        required: false
      - name: status
        in: query
        description: Filter by status. The status of the callback. The callback starts as `UNSENT`, transitions to `IN_PROGRESS`, then to `SENT` or `FAILED`. If the callback is skipped (mostly due to manual interventions), it will be marked as `SKIPPED`. The status `TO_BE_SEND_IMMEDIATELY` is a short-lived, intermediate status similar to `UNSENT`.
        schema:
          type: string
          enum:
          - UNSENT
          - IN_PROGRESS
          - SENT
          - FAILED
          - SKIPPED
          - TO_BE_SEND_IMMEDIATELY
        required: false
      - name: fromDate
        in: query
        description: The `from` date to filter by as zero-offset UTC time. The date boundary is inclusive. Meaning we compare with `>=`.
        schema:
          type: string
          format: date-time
          example: '2024-07-19T15:00:00.000000Z'
        required: false
      - name: toDate
        in: query
        description: The `to` date to filter by as zero-offset UTC time. The date boundary is inclusive. Meaning we compare with `<=`.
        schema:
          type: string
          format: date-time
          example: '2024-07-19T15:00:00.000000Z'
        required: false
      - name: byDateField
        in: query
        description: The date field to filter by if `fromDate` and `toDate` are present.
        schema:
          type: string
          enum:
          - createdAt
          - sentAt
          default: createdAt
        required: false
      - name: limit
        in: query
        description: The maximum number of items to return per page. The default value if not provided is 100, the maximum allowed value is 1000.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The field to sort by.
        schema:
          type: string
          enum:
          - organizationId
          - status
          - eventType
          - createdAt
      - name: sortDirection
        in: query
        description: The direction to sort by.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Callback log entries, sorted and filtered according to the request parameters.
                    items:
                      type: object
                      required:
                      - id
                      - entityId
                      - eventType
                      - organizationId
                      - status
                      - createdAt
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The ID of the callback log entry.
                        entityId:
                          type: string
                          format: uuid
                          description: The ID of the entity the callback is about. Together with the `eventType`, this uniquely identifies the business entity.
                        eventType:
                          type: string
                          description: The type of the event that triggered the callback.
                        organizationId:
                          type: string
                          format: uuid
                          description: The ID of the organization the callback is about.
                        status:
                          type: string
                          enum:
                          - UNSENT
                          - IN_PROGRESS
                          - SENT
                          - FAILED
                          - SKIPPED
                          - TO_BE_SEND_IMMEDIATELY
                          description: The status of the callback. The callback starts as `UNSENT`, transitions to `IN_PROGRESS`, then to `SENT` or `FAILED`. If the callback is skipped (mostly due to manual interventions), it will be marked as `SKIPPED`. The status `TO_BE_SEND_IMMEDIATELY` is a short-lived, intermediate status similar to `UNSENT`.
                        httpEndpoint:
                          type:
                          - string
                          - 'null'
                          description: The HTTP endpoint from the partners backend that was called for this callback.
                        httpResponseCode:
                          type:
                          - string
                          - 'null'
                          description: The latest HTTP response code from the partners backend for this callback.
                        attemptCount:
                          type:
                          - integer
                          - 'null'
                          description: The amount of attempts to send the callback, includes retries.
                        createdAt:
                          type: string
                          format: date-time
                          description: The date and time when the callback was created in Pliant's database.
                        sentAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date and time when the callback was successfully sent to the partners backend.
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /callbacks/resend:
    post:
      summary: Resend Callbacks
      description: 'Re-trigger delivery of previously produced webhook callbacks identified by their callback ids. Use this endpoint to recover from callbacks that were missed or could not be processed by your system.

        Use the `GET /callbacks` endpoint to look up the ids of callbacks you want to resend.

        Each callback''s owning organization must be within your scope of access. The request is rejected with `403 Forbidden` if any of the provided callback ids is unknown or refers to an organization you are not authorized for. A maximum of 1000 callback ids can be resent in a single call.

        A successful call returns `202 Accepted` immediately — callbacks are delivered asynchronously through the standard callback delivery pipeline (with retries and back-off) and will appear in the callback log under their existing callback id.'
      tags:
      - Callbacks
      operationId: resend-callbacks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - callbackIds
              properties:
                callbackIds:
                  type: array
                  description: The ids of the callbacks to resend. Must contain between 1 and 1000 ids. Each id must refer to an existing callback whose owning organization is within your scope of access.
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    format: uuid
      responses:
        '202':
          description: The resend request was accepted. The listed callbacks will be re-delivered asynchronously through the standard callback delivery pipeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resendCount:
                    type: integer
                    description: The number of callbacks that were scheduled for re-delivery.
                    example: 1
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /callbacks/{callbackId}:
    get:
      summary: Get Callback
      description: Get details about a specific callback, like its payload. This endpoint is useful for debugging and investigating issues with callbacks.
      tags:
      - Callbacks
      operationId: get-callback
      parameters:
      - name: callbackId
        in: path
        description: The callback id for which to fetch details.
        schema:
          type: string
          format: uuid
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The ID of the callback log entry.
                  entityId:
                    type: string
                    format: uuid
                    description: The ID of the entity the callback is about. Together with the `eventType`, this uniquely identifies the business entity.
                  eventType:
                    type: string
                    description: The type of the event that triggered the callback.
                  organizationId:
                    type: string
                    format: uuid
                    description: The ID of the organization the callback is about.
                  payload:
                    type: string
                    description: The payload of the callback as we originally sent it to you. The structure depends on the `eventType`. The JSON notation is escaped (with `\`) and encoded as a string.
                  attemptCount:
                    type: integer
                    description: The amount of attempts to send the callback, includes retries.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /subscriptions:
    get:
      summary: Get Callback Subscriptions
      description: Fetch information about currently subscribed callback events.
      tags:
      - Callbacks
      operationId: get-callback-subscriptions
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required:
                - subscriptions
                - callbacksEnabled
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - eventType
                      - callbackUrl
                      properties:
                        id:
                          type: string
                          format: uuid
                        eventType:
                          type: string
                          description: event name (see individual callback subscription endpoints for details)
                        callbackUrl:
                          type: string
                          description: callback url to which we send the callback in case an event is triggered
                  callbacksEnabled:
                    type: boolean
                    description: Indicates whether callbacks are enabled for the partner
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /subscriptions/bulk-upsert:
    post:
      summary: Add Multiple Callback Subscriptions
      description: 'Create multiple callback subscriptions in a single request.


        This endpoint allows you to create callback subscriptions for multiple event types and callback URLs.

        Callback subscriptions are identified by the combination of event type and callback URL. If a callback subscription

        with the same event type and callback URL already exists, it will be included in the response but not created again.


        **Semantics:**

        - Multiple callback subscriptions per event type are now allowed, as long as they have different callback URLs

        - Existing callback subscriptions with matching event type and callback URL are not changed, but included in the response

        - Only the callback subscriptions specified in the request are affected; other existing callback subscriptions remain unchanged

        - At most 42 callback subscriptions per event type are allowed'
      tags:
      - Callbacks
      operationId: bulk-upsert-subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subscriptions
              properties:
                subscriptions:
                  type: array
                  description: List of subscriptions to create or update
                  items:
                    type: object
                    required:
                    - eventType
                    - callbackUrl
                    properties:
                      eventType:
                        type: string
                        description: The event type to subscribe to (see individual callback subscription endpoints for details)
                      callbackUrl:
                        type: string
                        format: uri
                        description: The callback URL to which we send the callback when an event is triggered. Must be a valid and reachable HTTPS URL.
                        example: https://partner.example.com/send/callback/here
      responses:
        '200':
          description: Ok. Returns the affected subscriptions (both newly created and existing ones that matched).
          content:
            application/json:
              schema:
                type: object
                required:
                - subscriptions
                - callbacksEnabled
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/paths/~1subscriptions/get/responses/200/content/application~1json/schema/properties/subscriptions/items'
                  callbacksEnabled:
                    type: boolean
                    description: Indicates whether callbacks are enabled for the partner
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
