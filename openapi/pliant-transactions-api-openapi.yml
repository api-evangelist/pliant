                          confirmationDate:
                            type:
                            - string
                            - 'null'
                            format: date-time
                            description: The date-time this transaction was confirmed by the card network, e.g. `2023-09-19T07:24:52.707296Z`. This property is only available in the response of TRANSACTION_CONFIRMED event and not in the response of TRANSACTION_AUTHORIZED event.
                          billingAmount:
                            type: object
                            description: The amount that was billed to the cardholder, in the currency of the card account.
                            properties:
                              value:
                                type: number
                                description: The value of the amount, converted to minor units of the currency. E.g. 1 EUR is 100 cents, thus the value is 100.
                              currency:
                                type: string
                                description: The currency of the amount, in ISO 4217 format. E.g. `EUR` for Euro.
                          transactionAmount:
                            type: object
                            description: The amount that was paid to the merchant via this transaction, in the local currency of the merchant.
                            properties:
                              value:
                                type: number
                                description: The value of the amount, converted to minor units of the currency. E.g. 1 EUR is 100 cents, thus the value is 100.
                              currency:
                                type: string
                                description: The currency of the amount, in ISO 4217 format. E.g. `EUR` for Euro.
                          merchantRawData:
                            type: object
                            description: Raw merchant data as received from the card network, thus the quality of those fields differ greatly between merchants. We do not control the information provided here.
                            properties:
                              merchantName:
                                type:
                                - string
                                - 'null'
                                description: The merchant category code (MCC) description is a short description of the MCC.
                              merchantCountry:
                                type:
                                - string
                                - 'null'
                                description: The country of the merchant, in ISO 3166-1 alpha-3 format.
                                minLength: 3
                                maxLength: 3
                              mcc:
                                type:
                                - string
                                - 'null'
                                description: The merchant category code (MCC) is a four-digit number assigned to a business by an acquiring bank or institution. The MCC is used to classify the business by the type of goods or services it provides.
                              merchantNameConfirmation:
                                type:
                                - string
                                - 'null'
                                description: Confirmation message by the merchant. This property is only available in the response of TRANSACTION_CONFIRMED event and not in the response of TRANSACTION_AUTHORIZED event.
              responses:
                '200':
                  description: We expect the partner to return a HTTP 200 status code if the callback was successfully received. On 4xx and 5xx status codes, we will [retry](/docs/callbacks#retries) the callback.
