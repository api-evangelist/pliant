openapi: 3.2.0
info:
  contact:
    name: API Support
    email: support@getpliant.com
    url: https://www.getpliant.com
  title: Pliant Customer Transactions API
  description: Pliant Customer API
  version: 2.1.0
  license:
    name: MIT
    url: https://opensource.org/license/MIT
servers:
- url: https://partner-api.getpliant.com/api
  description: Pliant Production Server
- url: https://sandbox.partner-api.getpliant.com/api
  description: Pliant Sandbox Server
- url: https://pci-api.getpliant.com
  description: PCI Vault Production Server
- url: https://pci-sandbox.partner-api.getpliant.com
  description: PCI Vault Sandbox Server
security:
- bearerAuth: []
tags:
- name: Transactions
  description: This tag is for operations related to transactions
paths:
  /transactions:
    get:
      summary: List of Transactions
      description: Returns a list of transactions. You can use the `limit`, `page`, `sortBy`, `sortDirection` parameters to filter and sort the results. You can also use filters like the `partnerSubmissionStatus` to e.g. only get transactions that you as a partner have not synced yet.
      tags:
      - Transactions
      operationId: get-transactions
      parameters:
      - name: organizationId
        in: query
        description: The ID of the organization to get the transactions for.
        schema:
          type: string
          format: uuid
        required: true
      - name: status
        in: query
        description: The status of the transactions to filter by.
        schema:
          type: string
          enum:
          - DECLINED
          - PENDING
          - REVERSED
          - CONFIRMED
          - BOOKED
      - name: type
        in: query
        description: The type of the transactions to filter by.
        schema:
          type: string
          enum:
          - PURCHASE
          - CASH_WITHDRAWAL
          - REFUND
          - CHARGEBACK
          - RECHARGE
          - STATUS_INQUIRY
      - name: partnerSubmissionStatus
        in: query
        description: The partner submission status of the transactions to filter by.
        schema:
          type: string
          enum:
          - NOT_SYNCED
          - SYNCED
          - TEMP_LOCKED
          - LOCKED
      - name: cardAccountId
        in: query
        description: The ID of the [card account](/docs/card-account) to get the transactions for. Transactions keep the card account id they were booked on. If a card account was superseded, filtering by the superseded id returns the transactions booked before the switch and filtering by its successor (`supersededBy`) returns the ones booked after. Query both ids to get a complete list across the switch.
        schema:
          type: string
          format: uuid
      - name: cardholderId
        in: query
        description: The ID of the [cardholder](/docs/cardholder-entity) to get the transactions for.
        schema:
          type: string
          format: uuid
      - name: cardId
        in: query
        description: The ID of the card to get the transactions for.
        schema:
          type: string
          format: uuid
      - name: fromDate
        in: query
        description: The `from` date to filter by as zero-offset UTC time. The date boundary is inclusive. Meaning we compare with `>=`.
        schema:
          type: string
          format: date-time
          example: '2024-07-19T15:00:00.000000Z'
      - name: toDate
        in: query
        description: The `to` date to filter by as zero-offset UTC time. The date boundary is inclusive. Meaning we compare with `<=`.
        schema:
          type: string
          format: date-time
          example: '2024-07-19T15:00:00.000000Z'
      - name: byDateField
        in: query
        description: The date field to filter by if `fromDate` and `toDate` are present.
        schema:
          type:
          - string
          - 'null'
          enum:
          - confirmedAt
          - createdAt
          - bookedAt
          - updatedAt
          default: confirmedAt
      - name: limit
        in: query
        description: The maximum number of items to return per page. The default value if not provided is 100, the maximum allowed value is 1000.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The field to sort by.
        schema:
          type: string
          enum:
          - organizationId
          - status
          - type
          - cardholderId
          - cardId
          - merchantId
          - confirmedAt
          - createdAt
      - name: sortDirection
        in: query
        description: The direction to sort by.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        transactionId:
                          type: string
                          format: uuid
                          description: The ID of the transaction.
                        organizationId:
                          type: string
                          format: uuid
                          description: The ID of the organization this transaction belongs to.
                        cardAccountId:
                          type: string
                          format: uuid
                          description: The ID of the [card account](/docs/card-account) this transaction belongs to.
                        cardholderId:
                          type: string
                          format: uuid
                          description: The ID of the [cardholder](/docs/cardholder-entity) this transaction belongs to.
                        cardId:
                          type: string
                          format: uuid
                          description: The ID of the card this transaction belongs to.
                        status:
                          type: string
                          description: The status of the transaction.
                          enum:
                          - DECLINED
                          - PENDING
                          - REVERSED
                          - CONFIRMED
                          - BOOKED
                        type:
                          type: string
                          description: The type of the transaction.
                          enum:
                          - PURCHASE
                          - CASH_WITHDRAWAL
                          - REFUND
                          - CHARGEBACK
                          - RECHARGE
                          - STATUS_INQUIRY
                        partnerSubmissionStatus:
                          type: string
                          description: The partner submission status of the transaction. `TEMP_LOCKED` makes the transaction immutable for cardholders within Pliant apps. `TEMP_LOCKED` can be changed to `SYNCED`. `LOCKED` makes them immutable for all users and is the final state that cannot be modified anymore.
                          enum:
                          - NOT_SYNCED
                          - SYNCED
                          - TEMP_LOCKED
                          - LOCKED
                        billingAmount:
                          type: object
                          description: The amount that was billed to the cardholder, in the currency of the card account.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        transactionAmount:
                          type: object
                          description: The amount that was transacted.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        confirmedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time when the transaction was confirmed.
                        createdAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time when the transaction was created.
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time when the transaction was updated.
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /transactions/details:
    post:
      summary: Transaction Details
      description: 'Returns all transaction details for the given IDs. You can also request transaction details per card(s), cardholder(s) or organization(s).

        The API returns all transaction details to the given input which can be found in the system. So you can also combine the different input fields (OR relation).

        Be aware that the usage of card, cardholder or organizations IDs most likely add multiple transaction details themselves.

        Also cardholders can be part of multiple organizations, thus when searching via cardholder IDs, it might return more data than it would for just one organization this cardholder is part of.

        At least one parameter has to be set.


        **This endpoint has changed in comparison to the previous version of the API.** The following changes were made:

        - we removed the following data from the response body: `merchantId` (field), `merchantName` (field)

        - we added the following data to the response body: `merchantData` (object), `merchantRawData` (object), `authCode` (field)'
      tags:
      - Transactions
      operationId: get-transactions-detail-batch
      requestBody:
        required: true
        description: All fields are optional. At least one parameter has to be set.
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionIds:
                  type: array
                  description: The unique identifiers of the transactions.
                  items:
                    type: string
                    format: uuid
                cardIds:
                  type: array
                  description: The unique identifiers of the credit cards used for making the transaction(s).
                  items:
                    type: string
                    format: uuid
                cardholderIds:
                  type: array
                  description: The unique identifiers of the cardholders.
                  items:
                    type: string
                    format: uuid
                organizationIds:
                  type: array
                  description: The unique identifiers of the organizations.
                  items:
                    type: string
                    format: uuid
                cardAccountIds:
                  type: array
                  description: The unique identifiers of the card accounts.
                  items:
                    type: string
                    format: uuid
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                      description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
                    limit:
                      type: integer
                      description: The number of records to return per page.
                    sortBy:
                      type: object
                      description: The field to sort by and the direction to sort by.
                      properties:
                        field:
                          type: string
                          description: The field to sort by.
                          enum:
                          - organizationId
                          - status
                          - type
                          - cardholderId
                          - cardId
                          - merchantId
                          - confirmedAt
                          - createdAt
                          default: createdAt
                        direction:
                          description: The direction to sort by.
                          type: string
                          enum:
                          - ASC
                          - DESC
                          default: ASC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        transactionId:
                          type: string
                          format: uuid
                          description: The unique ID of the transaction.
                        organizationId:
                          type: string
                          format: uuid
                          description: The unique ID of the organization to which this transaction belongs to.
                        cardAccountId:
                          type: string
                          format: uuid
                          description: The unique ID of the [card account](/docs/card-account) to which this transaction belongs to.
                        cardholderId:
                          type: string
                          format: uuid
                          description: The unique ID of the [cardholder](/docs/cardholder-entity) to which this transaction belongs to.
                        cardId:
                          type: string
                          format: uuid
                          description: The unique ID of the card to which this transaction belongs to.
                        status:
                          type: string
                          description: The status of the transaction.
                          enum:
                          - DECLINED
                          - PENDING
                          - REVERSED
                          - CONFIRMED
                          - BOOKED
                        type:
                          type: string
                          description: The type of the transaction.
                          enum:
                          - PURCHASE
                          - CASH_WITHDRAWAL
                          - REFUND
                          - CHARGEBACK
                          - RECHARGE
                          - STATUS_INQUIRY
                        acceptanceMethod:
                          type:
                          - string
                          - 'null'
                          description: The method used to accept the transaction. Null indicates historical data without an acceptance method; NOT_AVAILABLE is an explicit value reported by the upstream provider.
                          enum:
                          - ONLINE
                          - MOBILE_WALLET
                          - MANUAL_ENTRY
                          - CONTACTLESS
                          - CHIP_DIP
                          - NOT_AVAILABLE
                          - MAGNETIC_STRIPE
                          - OTHER
                        partnerSubmissionStatus:
                          type: string
                          enum:
                          - NOT_SYNCED
                          - SYNCED
                          - TEMP_LOCKED
                          - LOCKED
                          description: This status can be driven by the partner to mark transactions on Pliant-side as consumed by the partner. `TEMP_LOCKED` makes transaction immutable for cardholders within Pliant apps. `LOCKED` makes them immutable for all users. `TEMP_LOCKED` can be changed to `SYNCED`. `LOCKED` is the final state that cannot be modified anymore
                        partnerSubmissionStatusSyncedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time the `partnerSubmissionStatus` was changed to `SYNCED`.
                        partnerSubmissionStatusTempLockedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time the `partnerSubmissionStatus` was changed to `TEMP_LOCKED`.
                        partnerSubmissionStatusLockedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time the `partnerSubmissionStatus` was changed to `LOCKED`.
                        category:
                          type: string
                          description: The category of the transaction. This groups together similar merchants into Pliant-defined categories.
                          enum:
                          - ADVERTISING_AND_MARKETING
                          - COMPUTING_AND_SOFTWARE
                          - EDUCATION_AND_TRAINING
                          - ELECTRONICS_AND_IT_EQUIPMENT
                          - ENTERTAINMENT_AND_WELLNESS
                          - FOOD_AND_DRINKS
                          - GIFTS_AND_VOUCHERS
                          - MATERIALS_AND_PACKAGING
                          - OFFICE_SUPPLIES_AND_EQUIPMENT
                          - SERVICES
                          - TRAVEL_AND_ACCOMMODATION
                          - HEALTHCARE
                          - OTHER
                        billingAmount:
                          type: object
                          description: The amount that was billed to the cardholder, in the currency of the card account.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        transactionAmount:
                          type: object
                          description: The amount that was paid to the merchant via this transaction, in the local currency of the merchant.
                          properties:
                            value:
                              type: number
                              description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                            currency:
                              type: string
                              description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                        transactionCountry:
                          type: string
                          description: ISO 3166-1 alpha-3 code of the country the transaction was made it, e.g. `DEU` for Germany or `NLD` for Netherlands. You can find a list of valid country code on [Wikipedia](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3).
                          minLength: 3
                          maxLength: 3
                        transactionLocalTime:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time the transaction was made in the local time of the merchant.
                        createdAt:
                          type: string
                          format: date-time
                          description: The date-time the transaction was first recognized by Pliant, e.g. `2023-09-15T11:55:34.527552Z`.
                        authorizedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time this transaction was authorized by the card network, e.g. `2023-09-15T11:55:34.527552Z`. Can be `null` for `DECLINED` or `REVERSED` transactions or for `STATUS_INQUIRY`, `REFUND`, `CHARGEBACK` or `RECHARGE` transactions.
                        confirmedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time this transaction was confirmed by the card network, e.g. `2023-09-19T07:24:52.707296Z`. Value is `null`, until the transaction is confirmed.
                        bookedAt:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: The date this transaction was booked by Pliant against the internal bank account of the organization, e.g. `2023-09-19`. Value is `null`, until the transaction is booked.
                        reversedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date-time this transaction was reversed by the card network, e.g. `2023-09-15T11:55:34.527552Z`. Value is only filled, if the transaction is reversed.
                        declineReason:
                          type:
                          - object
                          - 'null'
                          description: "Filled, if the transaction was declined. The decline reason `type`, together with `title` and `description` in all supported languages. E.g.:\n```\n{\n  \"type\": \"LOCKED_CARD\",\n  \"title\": {\n    \"en\": \"Card locked\"\n  },\n  \"description\": {\n    \"en\": \"The card is locked. You can unlock the card in the Wallet section of the cardholder app.\"\n  }\n}\n```\nIf the transaction status is anything else but `DECLINED` the object `declineReason` returns `null`\n"
                          properties:
                            type:
                              $ref: '#/paths/~1transactions~1{transactionId}/get/responses/200/content/application~1json/schema/properties/declineReason/properties/type'
                            title:
                              type: object
                              additionalProperties:
                                type: string
                              example:
                                en: Card locked
                                de: Karte ist gesperrt
                            description:
                              type: object
                              additionalProperties:
                                type: string
                              example:
                                en: The card is locked. You can unlock the card in the Wallet section of the cardholder app.
                        linkedTransactionId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: Optional reference to any original transaction, used for recharges, chargebacks and chargeback reversals.
                        receiptCount:
                          type: integer
                          description: Number of uploaded receipts to this transaction.
                          minLength: 0
                        receiptIds:
                          type: array
                          items:
                            type: string
                            format: uuid
                          description: The receipts attached to this transaction, if any. Otherwise, the array is empty.
                        receiptUploadEnabled:
                          type: boolean
                          description: This field describes if the transaction is waiting for a receipt, or if no receipt is expected for this transaction. If set to `true` its possible to upload receipts to the transaction, if set to `false` it is not possible to upload receipts to the transaction.
                        comment:
                          type:
                          - string
                          - 'null'
                          description: A cardholder-defined comment for this transaction.
                        merchantData:
                          type: object
                          description: Pliant's merchant data. If the merchant is not known to Pliant, the object is `null`.
                          properties:
                            pliantMerchantId:
                              type: string
                              format: uuid
                              description: Pliant's merchant ID (can be specific for each organization).
                            displayName:
                              type: string
                              description: Display merchant name that can be used to show additionally next to the raw merchant description.
                            logoPath:
                              type:
                              - string
                              - 'null'
                              description: The URL to the logo of the merchant, if there is any. It might be `null` for merchants we currently do not have in our database. The URL looks similar to this example `merchant-logos.getpliant.com/17e21b54-80d0-4843-9125-e522bb262ebb.png?v=3`. If you want to display the logo in your application, please make a copy of the logo and do not directly hotlink the logo. The static image should be served from your own infrastructure.
                        merchantRawData:
                          type: object
                          description: Raw merchant data as received from the card network, thus the quality of those fields differ greatly between merchants. We do not control the information provided here.
                          properties:
                            mcc:
                              type:
                              - string
                              - 'null'
                              description: The merchant category code (MCC) is a four-digit number assigned to a business by an acquiring bank or institution. The MCC is used to classify the business by the type of goods or services it provides.
                            mccDesc:
                              type:
                              - string
                              - 'null'
                              description: The merchant category code (MCC) description is a short description of the MCC.
                            merchantStreet:
                              type:
                              - string
                              - 'null'
                              description: The street of the merchant.
                            merchantCity:
                              type:
                              - string
                              - 'null'
                              description: The city of the merchant.
                            merchantRegion:
                              type:
                              - string
                              - 'null'
                              description: The region of the merchant.
                            merchantPostcode:
                              type:
                              - string
                              - 'null'
                              description: The postcode of the merchant.
                            merchantCountry:
                              type:
                              - string
                              - 'null'
                              description: The country of the merchant, in ISO 3166-1 alpha-3 format.
                              minLength: 3
                              maxLength: 3
                            merchantPhone:
                              type:
                              - string
                              - 'null'
                              description: The phone number of the merchant.
                            merchantUrl:
                              type:
                              - string
                              - 'null'
                              description: The URL of the merchant.
                            merchantNameOther:
                              type:
                              - string
                              - 'null'
                              description: The name of the merchant in the local language.
                            merchantLegalName:
                              type:
                              - string
                              - 'null'
                              description: The legal name of the merchant.
                            merchantTaxId:
                              type:
                              - string
                              - 'null'
                              description: The tax ID of the merchant.
                            merchantContact:
                              type:
                              - string
                              - 'null'
                              description: The contact information of the merchant.
                            merchantTerminalId:
                              type:
                              - string
                              - 'null'
                              description: The terminal ID of the merchant used to make this transaction.
                            descriptionAuthorization:
                              type:
                              - string
                              - 'null'
                              description: Authorization message by the merchant.
                            descriptionConfirmation:
                              type:
                              - string
                              - 'null'
                              description: Confirmation message by the merchant.
                        authCode:
                          type:
                          - string
                          - 'null'
                          description: Authorization code used for this transaction.
                        paymentDate:
                          type:
                          - string
                          - 'null'
                          format: date
                          description: The date on which the outstanding amount of this transaction was paid back to Pliant. It basically is the date the bank settlement was received by Pliant. This field is only filled after the next payment frequency cycle of this organization. The format of the date is `YYYY-MM-DD`.
                        paymentReference:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: The reference to the payment with which this transaction was paid to Pliant. Check the [payment API](getpaymentsdetail) to get details about the payment. This field is only filled after the next payment frequency cycle of this organization and also only if the organization is not solely using prefund accounts (where there are no regular payments).
                        wallet:
                          type: string
                          description: If the transaction was made using a mobile wallet (`APPLE` or `ANDROID`), the respective wallet type is returned. Otherwise, the field is `OTHER`.
                          enum:
                          - APPLE
                          - ANDROID
                          - OTHER
                        fxFee:
                          type: object
                          description: The foreign exchange fee that was charged for this transaction, if any.
                          properties:
                            fxFeePercentage:
                              type:
                              - number
                              - 'null'
                              description: 'The per-organization fee (as a percentage of the transaction amount) that is charged for foreign exchange transactions. This value is specific to this organization. Example: `2.1`.'
                              format: float
                              example: 2.1
                              minimum: 0
                              maximum: 100
                            fxFeeAmount:
                              type:
                              - object
                              - 'null'
                              description: 'The specific amount of the foreign exchange fee that was charged for this transaction. Example: `0.21 EUR`.'
                              properties:
                                value:
                                  type: number
                                  description: The value of the monetary amount, converted to minor units of the currency. For instance 1.00 EUR is 100 cents, thus the value here is `100`. See our [guides](/docs/monetary-values) for more details about how to handle monetary amounts.
                                  example: 21
                                currency:
                                  type: string
                                  description: The currency of the monetary amount in ISO 4217 format, for example `EUR` for Euro or `USD` for US Dollar.
                                  example: EUR
                        personal:
                          type: boolean
                          description: Indicates transaction was done for personal purpose.
                        acquirerReferenceNumber:
                          type: string
                          description: The acquirer reference number as provided by the card network for the transaction.
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
