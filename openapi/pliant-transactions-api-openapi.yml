  /transactions/partner-submission-status:
    post:
      summary: Update Partner Submission Status (Multiple)
      description: Updates the partnerSubmissionStatus of one or more transactions. See documentation for more information.
      tags:
      - Transactions
      operationId: update-transaction-partner-submission-status-batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partnerSubmissionStatus:
                  type: string
                  enum:
                  - NOT_SYNCED
                  - SYNCED
                  - TEMP_LOCKED
                  - LOCKED
                  description: The status `NOT_SYNCED` is the default status of a transaction, it can be changed to `SYNCED` by the partner, e.g. if the partner consumed a transaction successfully. The status `TEMP_LOCKED` makes the transaction immutable for cardholders within Pliant's apps - it is a reversible status and can be changed back to `SYNCED`. `LOCKED` makes a transaction immutable for all users. `LOCKED` is the final status which cannot be modified anymore.
                transactionIds:
                  type: array
                  description: The unique identifiers of the transactions.
                  items:
                    type: string
                    format: uuid
              required:
              - partnerSubmissionStatus
              - transactionIds
      responses:
        '202':
          description: Ok
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /transactions/subscription:
    post:
      summary: 'Callback: Add/Update'
      description: Subscribe to callbacks for this entity or change an existing callback.
      tags:
      - Transactions
      operationId: create-transaction-subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callbackUrl:
                  type: string
                  format: uri
                  example: https://myserver.com/send/callback/here
                  description: The URL to send the callback to. Must be a valid and reachable URL. We do some basic validation to ensure the URL is syntactically correct and reachable for Pliant. Only HTTPS URLs are supported.
                eventTypes:
                  type: array
                  description: The event types to subscribe to.
                  items:
                    type: string
                    enum:
                    - TRANSACTION_CREATED
                    - TRANSACTION_UPDATED
                    - TRANSACTION_TYPE_UPDATED
                    - TRANSACTION_STATUS_CHANGED
                    - TRANSACTION_AMOUNT_CHANGED
                    - TRANSACTION_MERCHANT_UPDATED
                    - TRANSACTION_AUTH_CODE
                    - TRANSACTION_AUTHORIZED
                    - TRANSACTION_CONFIRMED
                    - TRANSACTION_COMMENT_UPDATED
                    - TRANSACTION_RECEIPT_UPLOAD_ENABLED_UPDATED
              required:
              - callbackUrl
              - eventTypes
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
