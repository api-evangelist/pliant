tags:
- name: Card Sensitive Data
  description: This tag is for operations related to card sensitive data
paths:
  /card-details/widget/{cardId}/otp:
    get:
      summary: Get OTP for PCI Widget
      description: 'This endpoint is used to get an OTP for the PCI Widget (Web and Mobile). The OTP is used to authenticate the cardholder request and to retrieve the sensitive card data.

        The request has to be made from the backend of your application. Directly calling this endpoint from your frontend is not allowed due to security reasons.


        **A dedicated host URL `pci-api.getpliant.com` is used for this endpoint!** Please refer to the documentation for more information.'
      tags:
      - Card Sensitive Data
      operationId: get-otp-for-pci-widget
      parameters:
      - name: cardId
        in: path
        required: true
        description: The Pliant card id (UUIDv4) of the card for which the OTP is requested.
        schema:
          type: string
          format: uuid
          maxLength: 36
          minLength: 36
      - name: Pliant-Trace-Id
        in: header
        required: true
        description: A random, unique trace id (UUIDv4) per request, generated by the partner. This id is used for logging and troubleshooting purposes throughout all systems. It has to be newly generated per request.
        schema:
          type: string
          format: uuid
          maxLength: 36
          minLength: 36
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: string
                example: '12345678'
                description: The OTP for the PCI Widget
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /card-details/{cardId}:
    get:
      summary: Get PAN & CVV (PCI-DSS)
      description: 'This endpoint is only available for **PCI-DSS certified companies**. They can use this endpoint to retrieve the (encrypted) PAN and CVV of a card.


        **A dedicated host URL `pci-api.getpliant.com` is used for this endpoint!** Please refer to the documentation for more information.'
      tags:
      - Card Sensitive Data
      operationId: card-pan-and-cvv-pci-vault
      parameters:
      - name: cardId
        in: path
        required: true
        description: The Pliant card id (UUIDv4) of the card for which the PAN and CVV are requested.
        schema:
          type: string
          format: uuid
          maxLength: 36
          minLength: 36
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: The Pliant internal ID of the card.
                  pan:
                    type: string
                    minLength: 16
                    maxLength: 16
                    description: The PAN (Primary Account Number) of the card, also known as the credit card number.
                  cvv:
                    type: string
                    minLength: 3
                    maxLength: 3
                    description: The CVV (Card Verification Value) of the card, also known as the card security code.
                  expiryMonth:
                    type: integer
                    description: The expiry month of the card.
                  expiryYear:
                    type: integer
                    description: The expiry year of the card.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /cards/{cardId}/pin:
    get:
      summary: Get PIN
      description: Returns the 4-digit PIN of a **physical and active** credit card. If the card is neither physical nor active, the response will be a HTTP 400.
      tags:
      - Card Sensitive Data
      operationId: get-card-pin
      parameters:
      - name: cardId
        description: The Pliant card id (UUIDv4) of the card for which the PIN is requested.
        in: path
        required: true
        schema:
          type: string
          format: uuid
          maxLength: 36
          minLength: 36
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  pin:
                    type: string
                    description: The 4-digit PIN of the physical card.
                    minLength: 4
                    maxLength: 4
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /cards/{cardId}/tokenized-pan:
    post:
      summary: Get PAN & CVV (Proxy)
      description: Fetch a tokenized PAN from our partner PCI-Proxy to process and use in your non-PCI compliant environment. **This only works in combination with our partner PCI-Proxy**. You find more details in our guides section.
      tags:
      - Card Sensitive Data
      operationId: card-pan-tokenized-from-pci-proxy
      parameters:
      - name: cardId
        in: path
        required: true
        description: The Pliant `cardId` of the card for which the tokenized PAN should be generated. You can obtain the `cardId` from the [list card endpoint](/reference/getcards).
        schema:
          type: string
          format: uuid
          maxLength: 36
          minLength: 36
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pciProxyApiKey
              - pciProxyMerchantId
              properties:
                pciProxyApiKey:
                  type: string
                  description: Your API key for using PCI-Proxy. You can find this in your PCI-Proxy dashboard.
                pciProxyMerchantId:
                  type: string
                  description: The merchant id from PCI-Proxy you want to use. You can find this in your PCI-Proxy dashboard.
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  cardId:
                    type: string
                    format: uuid
                    description: The Pliant `cardId` of the card for which the tokenized PAN is requested.
                  tokenizedPan:
                    type: string
                    description: The tokenized PAN, which can be used in your non-PCI compliant environment. This for now only works with our partner PCI-Proxy.
                  tokenizedCvv:
                    type: string
                    description: The tokenized CVV, which can be used in your non-PCI compliant environment. This for now only works with our partner PCI-Proxy.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '404':
          $ref: '#/paths/~1cards/post/responses/404'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: This API uses oAuth2 with client credentials flow to [obtain the Bearer Token](/docs/authenticated-api-usage).
      bearerFormat: JWT
