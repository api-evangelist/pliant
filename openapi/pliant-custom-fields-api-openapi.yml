openapi: 3.2.0
info:
  contact:
    name: API Support
    email: support@getpliant.com
    url: https://www.getpliant.com
  title: Pliant Customer Custom Fields API
  description: Pliant Customer API
  version: 2.1.0
  license:
    name: MIT
    url: https://opensource.org/license/MIT
servers:
- url: https://partner-api.getpliant.com/api
  description: Pliant Production Server
- url: https://sandbox.partner-api.getpliant.com/api
  description: Pliant Sandbox Server
- url: https://pci-api.getpliant.com
  description: PCI Vault Production Server
- url: https://pci-sandbox.partner-api.getpliant.com
  description: PCI Vault Sandbox Server
security:
- bearerAuth: []
tags:
- name: Custom Fields
  description: This tag is for operations related to custom fields
paths:
  /transactions/custom-fields:
    get:
      summary: List Custom Fields
      description: Returns a list of all custom fields for the given organization. Custom fields can be created by the organization via the Pliant web app or API. Those fields can be used to store additional information on transactions, e.g. an additional field needed for pre-accounting purposes, or a reference the organizations needs to reconciliation processes later in their systems. Custom fields can be set on card- or transaction-level. If set on card-level, each transaction made with this card gets a copy of the custom field values of the respective card.
      tags:
      - Custom Fields
      operationId: get-custom-fields
      parameters:
      - name: organizationId
        required: true
        in: query
        description: The unique identifier of the organization.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: The maximum number of items to return per page. The default value if not provided is 100, the maximum allowed value is 1000.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
        schema:
          type: integer
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the custom field.
                        label:
                          type: string
                          description: The label of the custom field, displayed in a UI for example.
                        description:
                          type:
                          - string
                          - 'null'
                          description: The description of the custom field, displayed in a UI for example.
                        defaultValue:
                          type:
                          - string
                          - 'null'
                          description: The default value of the custom field, optional.
                        type:
                          type: string
                          description: 'The type of the custom field.

                            `TEXT` represents a custom field which can store any text value.

                            `SELECT` represents a custom field which can store a fixed set of options.

                            '
                          enum:
                          - TEXT
                          - SELECT
                        status:
                          type: string
                          description: The status of the custom field. Only an active custom field can be used.
                          enum:
                          - ACTIVE
                          - INACTIVE
                        automationType:
                          type: string
                          description: The automation type of the custom field. For now only `CARD` is supported. This means, that the [custom fields](/docs/custom-fields-on-transactions) default value will be copied to every transaction made with the card the field is set on.
                          enum:
                          - CARD
                        mandatoryOnAutomation:
                          type: boolean
                          description: If set to true, this means this custom field is mandatory to be filled with a default value on the level of the automation, here `CARD`.
                        mandatoryForExport:
                          type: boolean
                          description: If set to true, this means this custom field is mandatory to be filled on every transaction which should be exported with the Pliant accounting export.
                        visibility:
                          type: string
                          description: 'Controls where the values of this custom field are visible.

                            `ADMIN_AND_CARDHOLDER` makes the values visible to both admins and cardholders.

                            `ADMIN_ONLY` makes the values visible only to admins.

                            `NOWHERE` hides the values from both admins and cardholders.

                            '
                          enum:
                          - ADMIN_AND_CARDHOLDER
                          - ADMIN_ONLY
                          - NOWHERE
                        createdAt:
                          type: string
                          format: date-time
                          description: The date and time the custom field was created.
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date and time the custom field was last updated.
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
    post:
      summary: Create Custom Field
      description: Create a new custom field for the organization. Custom fields can be used to store additional information on transactions. For example, you can create a custom field to store an internal identifier, a project name, or accounting related data. Custom fields can be of type `TEXT` or `SELECT`. `TEXT` custom fields can store any text value. `SELECT` custom fields can store a fixed set of options. Each new custom field is created `ACTIVE`.
      tags:
      - Custom Fields
      operationId: create-custom-field
      parameters:
      - name: organizationId
        required: true
        in: query
        description: The unique identifier of the organization to create the custom field for.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - label
              - type
              - automationType
              - mandatoryOnAutomation
              - mandatoryForExport
              properties:
                label:
                  type: string
                  description: The label of the custom field, displayed in the UI.
                description:
                  type: string
                  description: The description of the custom field, displayed in the UI, optional.
                defaultValue:
                  type: string
                  description: The default value of the custom field, optional.
                type:
                  type: string
                  description: 'The type of the custom field.

                    `TEXT` represents a custom field which can store any text value.

                    `SELECT` represents a custom field which can store a fixed set of options.

                    '
                  enum:
                  - TEXT
                  - SELECT
                automationType:
                  type: string
                  description: The automation type of the custom field. For now only `CARD` is supported. This means, that the [custom fields](/docs/custom-fields-on-transactions) default value will be copied to every transaction made with the card the field is set on.
                  enum:
                  - CARD
                mandatoryOnAutomation:
                  type: boolean
                  description: If set to true, this means this custom field is mandatory to be filled with a default value on the level of the automation, here `CARD`.
                mandatoryForExport:
                  type: boolean
                  description: If set to true, this means this custom field is mandatory to be filled on every transaction which should be exported with the Pliant accounting export.
                visibility:
                  type: string
                  description: 'Controls where the values of this custom field are visible.

                    `ADMIN_AND_CARDHOLDER` makes the values visible to both admins and cardholders.

                    `ADMIN_ONLY` makes the values visible only to admins.

                    `NOWHERE` hides the values from both admins and cardholders.

                    Optional; defaults to `ADMIN_AND_CARDHOLDER` when omitted.

                    '
                  enum:
                  - ADMIN_AND_CARDHOLDER
                  - ADMIN_ONLY
                  - NOWHERE
                  default: ADMIN_AND_CARDHOLDER
      responses:
        '200':
          description: Ok. The custom field can be used after you received the callback for the `CUSTOM_FIELD_CREATED` event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the custom field.
                        label:
                          type: string
                          description: The label of the custom field, displayed in a UI for example.
                        description:
                          type:
                          - string
                          - 'null'
                          description: The description of the custom field, displayed in a UI for example.
                        defaultValue:
                          type:
                          - string
                          - 'null'
                          description: The default value of the custom field, optional.
                        type:
                          type: string
                          description: 'The type of the custom field.

                            `TEXT` represents a custom field which can store any text value.

                            `SELECT` represents a custom field which can store a fixed set of options.

                            '
                          enum:
                          - TEXT
                          - SELECT
                        status:
                          type: string
                          description: The status of the custom field. Only an active custom field can be used.
                          enum:
                          - ACTIVE
                          - INACTIVE
                        automationType:
                          type: string
                          description: The automation type of the custom field. For now only `CARD` is supported. This means, that the [custom fields](/docs/custom-fields-on-transactions) default value will be copied to every transaction made with the card the field is set on.
                          enum:
                          - CARD
                        mandatoryOnAutomation:
                          type: boolean
                          description: If set to true, this means this custom field is mandatory to be filled with a default value on the level of the automation, here `CARD`.
                        mandatoryForExport:
                          type: boolean
                          description: If set to true, this means this custom field is mandatory to be filled on every transaction which should be exported with the Pliant accounting export.
                        visibility:
                          type: string
                          description: 'Controls where the values of this custom field are visible.

                            `ADMIN_AND_CARDHOLDER` makes the values visible to both admins and cardholders.

                            `ADMIN_ONLY` makes the values visible only to admins.

                            `NOWHERE` hides the values from both admins and cardholders.

                            '
                          enum:
                          - ADMIN_AND_CARDHOLDER
                          - ADMIN_ONLY
                          - NOWHERE
                        createdAt:
                          type: string
                          format: date-time
                          description: The date and time the custom field was created.
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date and time the custom field was last updated.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /transactions/custom-fields/{customFieldId}:
    put:
      summary: Update Custom Field
      description: Update an existing custom field for the organization. Custom fields can be used to store additional information on transactions.
      tags:
      - Custom Fields
      operationId: update-custom-field
      parameters:
      - name: customFieldId
        required: true
        in: path
        description: The unique identifier of the custom field to update.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - label
              - status
              - mandatoryOnAutomation
              - mandatoryForExport
              properties:
                label:
                  type: string
                  description: The label of the custom field, displayed in the UI.
                description:
                  type: string
                  description: The description of the custom field, displayed in the UI, optional.
                defaultValue:
                  type: string
                  description: The default value of the custom field, optional.
                status:
                  type: string
                  description: The status of the custom field. Only an active custom field can be used.
                  enum:
                  - ACTIVE
                  - INACTIVE
                mandatoryOnAutomation:
                  type: boolean
                  description: If set to true, this means this custom field is mandatory to be filled with a default value on the level of the automation, here `CARD`.
                mandatoryForExport:
                  type: boolean
                  description: If set to true, this means this custom field is mandatory to be filled on every transaction which should be exported with the Pliant accounting export.
                visibility:
                  type: string
                  description: 'Controls where the values of this custom field are visible.

                    `ADMIN_AND_CARDHOLDER` makes the values visible to both admins and cardholders.

                    `ADMIN_ONLY` makes the values visible only to admins.

                    `NOWHERE` hides the values from both admins and cardholders.

                    Optional; if omitted, the existing value is preserved.

                    '
                  enum:
                  - ADMIN_AND_CARDHOLDER
                  - ADMIN_ONLY
                  - NOWHERE
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the custom field.
                        label:
                          type: string
                          description: The label of the custom field, displayed in a UI for example.
                        description:
                          type:
                          - string
                          - 'null'
                          description: The description of the custom field, displayed in a UI for example.
                        defaultValue:
                          type:
                          - string
                          - 'null'
                          description: The default value of the custom field, optional.
                        type:
                          type: string
                          description: 'The type of the custom field.

                            `TEXT` represents a custom field which can store any text value.

                            `SELECT` represents a custom field which can store a fixed set of options.

                            '
                          enum:
                          - TEXT
                          - SELECT
                        status:
                          type: string
                          description: The status of the custom field. Only an active custom field can be used.
                          enum:
                          - ACTIVE
                          - INACTIVE
                        automationType:
                          type: string
                          description: The automation type of the custom field. For now only `CARD` is supported. This means, that the [custom fields](/docs/custom-fields-on-transactions) default value will be copied to every transaction made with the card the field is set on.
                          enum:
                          - CARD
                        mandatoryOnAutomation:
                          type: boolean
                          description: If set to true, this means this custom field is mandatory to be filled with a default value on the level of the automation, here `CARD`.
                        mandatoryForExport:
                          type: boolean
                          description: If set to true, this means this custom field is mandatory to be filled on every transaction which should be exported with the Pliant accounting export.
                        visibility:
                          type: string
                          description: 'Controls where the values of this custom field are visible.

                            `ADMIN_AND_CARDHOLDER` makes the values visible to both admins and cardholders.

                            `ADMIN_ONLY` makes the values visible only to admins.

                            `NOWHERE` hides the values from both admins and cardholders.

                            '
                          enum:
                          - ADMIN_AND_CARDHOLDER
                          - ADMIN_ONLY
                          - NOWHERE
                        createdAt:
                          type: string
                          format: date-time
                          description: The date and time the custom field was created.
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: The date and time the custom field was last updated.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
    delete:
      summary: Delete Custom Field
      description: Delete an existing custom field on the organization. You can only delete custom fields that are not used in any transaction and in status `INACTIVE`. You can set the custom field to `INACTIVE` to prevent it from being used in new transactions via our update endpoint.
      tags:
      - Custom Fields
      operationId: delete-custom-field
      parameters:
      - name: customFieldId
        required: true
        in: path
        description: The unique identifier of the custom field to delete.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content. The custom field was successfully deleted.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /transactions/custom-fields/{customFieldId}/options:
    get:
      summary: List Custom Field Options
      description: Returns a list of all custom field options for the given custom field. Custom field options can be edited by the organization via the Pliant web app or API. Options give you the flexibility to define a fixed set of options a custom field can have. This can be useful for example if you want to restrict the values a customer can use.
      tags:
      - Custom Fields
      operationId: get-custom-field-options
      parameters:
      - name: customFieldId
        required: true
        in: path
        description: The unique identifier of the custom field for which you want to list the possible options. The custom field has to be of type `SELECT`.
        schema:
          type: string
          format: uuid
      - name: fromDate
        in: query
        description: The `from` date to filter by as zero-offset UTC time. The date boundary is inclusive. Meaning we compare with `>=`.
        schema:
          type: string
          format: date-time
          example: '2024-07-19T15:00:00.000000Z'
      - name: toDate
        in: query
        description: The `to` date to filter by as zero-offset UTC time. The date boundary is inclusive. Meaning we compare with `<=`.
        schema:
          type: string
          format: date-time
          example: '2024-07-19T15:00:00.000000Z'
      - name: byDateField
        in: query
        description: The date field to filter by if `fromDate` and `toDate` are present.
        schema:
          type:
          - string
          - 'null'
          enum:
          - createdAt
          - updatedAt
          default: createdAt
      - name: limit
        in: query
        description: The maximum number of items to return per page. The default value if not provided is 100, the maximum allowed value is 1000.
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return, starting with 0, this counts up to the total number of pages. The total number of pages is determined by the total number of records divided by the limit.
        schema:
          type: integer
      - name: sortBy
        in: query
        description: The field to sort by.
        schema:
          type: string
          enum:
          - createdAt
          - updatedAt
      - name: sortDirection
        in: query
        description: The direction to sort by.
        schema:
          type: string
          enum:
          - ASC
          - DESC
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the custom field option.
                        customFieldId:
                          type: string
                          format: uuid
                          description: The id of the custom field this option belongs to.
                        name:
                          type: string
                          description: The name of the custom field option, readable for humans.
                        value:
                          type: string
                          description: The value of the custom field option. This is mostly your internal value you want to process.
                        status:
                          type: string
                          description: The status of the custom field option. Only an active custom field option can be used.
                          enum:
                          - ACTIVE
                          - INACTIVE
                        isDefault:
                          type: boolean
                          description: If set to true, this means this custom field option is the default option for the related custom field.
                        createdAt:
                          type: string
                          format: date-time
                          description: The date and time the custom field option was created.
                        updatedAt:
                          type: string
                          format: date-time
                          description: The date and time the custom field option was last updated.
                  hasNextPage:
                    type: boolean
                    description: Indicates whether there is a next page available.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
    post:
      summary: Create Custom Field Option
      description: Add a new, single custom field option to a given custom field of type `SELECT`.
      tags:
      - Custom Fields
      operationId: create-custom-field-option
      parameters:
      - name: customFieldId
        required: true
        in: path
        description: The unique identifier of the custom field for which you want to add a new option.
        schema:
          type: string
          format: uuid
      - name: organizationId
        required: true
        in: query
        description: The unique identifier of the organization to create the custom field option for.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - value
              - isDefault
              properties:
                name:
                  type: string
                  description: The name of the custom field option, readable for humans.
                value:
                  type: string
                  description: The value of the custom field option. This is mostly your internal value you want to process.
                isDefault:
                  type: boolean
                  description: If set to true, this means this custom field option is the default option for the related custom field.
      responses:
        '200':
          description: Ok. The custom field option can be used after you received the callback for the `CUSTOM_FIELD_OPTION_CREATED` event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: The id of the custom field option.
                        customFieldId:
                          type: string
                          format: uuid
                          description: The id of the custom field this option belongs to.
                        name:
                          type: string
                          description: The name of the custom field option, readable for humans.
                        value:
                          type: string
                          description: The value of the custom field option. This is mostly your internal value you want to process.
                        status:
                          type: string
                          description: The status of the custom field option. Only an active custom field option can be used.
                          enum:
                          - ACTIVE
                          - INACTIVE
                        source:
                          type: string
                          description: The source of the custom field option, i.e. how it was created. `PLIANT` means it was created via the Pliant web app. `API` means it was created via the Pliant API. `ACCOUNTING_SYSTEM` means it was created via the accounting system used by the organization.
                          enum:
                          - PLIANT
                          - API
                          - ACCOUNTING_SYSTEM
                        externalReference:
                          type:
                          - string
                          - 'null'
                          description: The external reference of the custom field option. This is the reference in the accounting system and used only there.
                        isDefault:
                          type: boolean
                          description: If set to true, this means this custom field option is the default option for the related custom field.
                        createdAt:
                          type: string
                          format: date-time
                          description: The date and time the custom field option was created.
                        updatedAt:
                          type: string
                          format: date-time
                          description: The date and time the custom field option was last updated.
        '400':
          $ref: '#/paths/~1cards/get/responses/400'
        '401':
          $ref: '#/paths/~1cards/get/responses/401'
        '403':
          $ref: '#/paths/~1cards/get/responses/403'
        '429':
          $ref: '#/paths/~1cards/get/responses/429'
        '500':
          $ref: '#/paths/~1cards/get/responses/500'
  /transactions/custom-fields/{customFieldId}/options/{customFieldOptionId}:
